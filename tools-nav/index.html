    function filteredProjects() { return projects.filter((project) => { const haystack = [project.name, project.type, project.status, project.scene, project.summary, project.note, ...(project.tags || [])].join(" ").toLowerCase(); return (state.type === labels.allType || project.type === state.type) && (state.status === labels.allStatus || project.status === state.status) && (state.scene === labels.allScene || project.scene === state.scene) && (!state.search || haystack.includes(state.search)); }); }
    function cardTemplate(project) {
      const actions = project.url ? `<div class="btn-row">${project.extraUrl ? `<a class="ghost" href="${project.extraUrl}">${project.extraLabel || labels.open}</a>` : ""}<a class="visit" href="${project.url}">${labels.open}</a></div>` : `<span class="disabled">${labels.pending}</span>`;
      return `<article class="tool-card" style="--tool-accent:${project.accent}"><div class="tool-top"><div><div class="meta">${project.type} / ${project.scene}</div><h3>${project.name}</h3></div><div class="btn-row"><span class="status-badge">${project.status}</span><span class="badge">${project.badge}</span></div></div><p>${project.summary}</p><div class="tag-row">${(project.tags || []).slice(0,5).map((tag) => `<span class="chip">${tag}</span>`).join("")}</div><div class="mini-list"><div><span>\u5f53\u524d\u72b6\u6001</span><strong>${project.status}</strong></div><div><span>\u5165\u53e3\u8bf4\u660e</span><strong>${project.note}</strong></div></div><div class="card-bottom"><span class="meta">${project.url || "\u5373\u5c06\u52a0\u5165"}</span>${actions}</div></article>`;
    }
    function renderQuickGrid() { quickGridEl.innerHTML = projects.filter((project) => project.score >= 4).slice(0,4).map(cardTemplate).join(""); }
    function renderGrid() { const items = filteredProjects(); countEl.textContent = `${labels.showing} ${items.length} / ${projects.length} ${labels.items}`; renderQuickGrid(); gridEl.innerHTML = items.length ? items.map(cardTemplate).join("") : `<div class="empty">${labels.noMatch}</div>`; }
    typeChipsEl.addEventListener("click", (event) => { const button = event.target.closest("[data-type]"); if (!button) return; state.type = button.dataset.type; renderChips(); renderGrid(); });
    statusChipsEl.addEventListener("click", (event) => { const button = event.target.closest("[data-status]"); if (!button) return; state.status = button.dataset.status; renderChips(); renderGrid(); });
    sceneChipsEl.addEventListener("click", (event) => { const button = event.target.closest("[data-scene]"); if (!button) return; state.scene = button.dataset.scene; renderChips(); renderGrid(); });
    searchEl.addEventListener("input", () => { state.search = searchEl.value.trim().toLowerCase(); renderGrid(); });
    renderChips(); renderGrid();
  </script>
</body>
</html>
