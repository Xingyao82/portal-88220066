    const state={type:"all",status:"all",scene:"all",access:"all",search:""}; const quickNames=new Set(["iLovePDF","PDF24","iLoveIMG","Squoosh","Excalidraw","JSON Crack"]);
    const typeEl=document.getElementById("type-chips"),statusEl=document.getElementById("status-chips"),sceneEl=document.getElementById("scene-chips"),accessEl=document.getElementById("access-chips"),quickGridEl=document.getElementById("quick-grid"),gridEl=document.getElementById("grid"),countEl=document.getElementById("count"),statsEl=document.getElementById("stats"),brandEl=document.getElementById("brand"),searchEl=document.getElementById("search-input");
    const t=(lang,group,key)=>key==="all"?labels[lang][`all${group}`]:options[group.toLowerCase()][key][lang];
    const textFor=(tool,lang)=>({summary:tool.summary[lang],tags:tool.tags[lang],type:t(lang,"Type",tool.type),status:t(lang,"Status",tool.status),scene:t(lang,"Scene",tool.scene),access:t(lang,"Access",tool.access)});
    function renderStats(lang){brandEl.textContent=labels[lang].brand; searchEl.placeholder=labels[lang].searchPlaceholder; statsEl.innerHTML=labels[lang].stats.map(([label,value])=>`<div class="stat"><div class="stat-label">${label}</div><strong>${value}</strong></div>`).join("");}
    function renderChipGroup(container,values,group,current,lang){container.innerHTML=values.map((value)=>`<button class="chip-btn ${value===current?"active":""}" data-group="${group}" data-value="${value}" type="button">${t(lang,group,value)}</button>`).join("");}
    function filteredTools(lang){return tools.filter((tool)=>{const text=textFor(tool,lang); const haystack=[tool.name,text.summary,text.type,text.status,text.scene,text.access,...text.tags].join(" ").toLowerCase(); return (state.type==="all"||tool.type===state.type)&&(state.status==="all"||tool.status===state.status)&&(state.scene==="all"||tool.scene===state.scene)&&(state.access==="all"||tool.access===state.access)&&(!state.search||haystack.includes(state.search));});}

<script id="claw-grid-script">
(function(){
  const hideBlock = (selector) => {
    const el = document.querySelector(selector);
    if (!el) return;
    const section = el.closest('.section') || el.closest('.stats');
    if (section) section.style.display = 'none';
    else el.style.display = 'none';
  };
  ['#stats','#quick-grid','#featured-grid','.hero-actions'].forEach(hideBlock);

  const initials = (text) => {
    const clean = (text || '').replace(/\s+/g,' ').trim();
    if (!clean) return 'AI';
    if (/^[A-Za-z0-9]/.test(clean)) {
      const parts = clean.split(/[^A-Za-z0-9]+/).filter(Boolean);
      return (parts[0] || clean).slice(0,2).toUpperCase();
    }
    return clean.slice(0,2);
  };

  const logoUrls = (href) => {
    try {
      const parsed = new URL(href, window.location.href);
      if (!/^https?:$/.test(parsed.protocol)) return [];
      return [
        parsed.origin + '/favicon.ico',
        'https://www.google.com/s2/favicons?sz=128&domain_url=' + encodeURIComponent(parsed.href)
      ];
    } catch {
      return [];
    }
  };

  const attachLogoImage = (container, href, label) => {
    const urls = logoUrls(href);
    if (!urls.length) return;
    const img = document.createElement('img');
    img.alt = label + ' logo';
    img.loading = 'lazy';
    img.decoding = 'async';
    img.referrerPolicy = 'no-referrer';
    let index = 0;
    const next = () => {
      if (index >= urls.length) {
        container.classList.remove('has-image');
        img.remove();
        return;
      }
      img.src = urls[index++];
    };
    img.addEventListener('load', () => container.classList.add('has-image'));
    img.addEventListener('error', next);
    container.appendChild(img);
    next();
  };

  const enhanceCard = (card) => {
    if (card.querySelector('.mini-logo')) return;
    const top = card.querySelector('.tool-top') || card.querySelector('.card-top');
    if (!top) return;
    const info = top.firstElementChild;
    if (!info) return;
    const title = info.querySelector('h3,.model,h4');
    if (!title) return;
    const wrap = document.createElement('div');
    wrap.className = 'compact-head';
    const logo = document.createElement('span');
    logo.className = 'mini-logo';
    const fallback = document.createElement('span');
    fallback.className = 'mini-logo-fallback';
    fallback.textContent = initials(title.textContent);
    logo.appendChild(fallback);
    const link = card.querySelector('.visit[href]') || card.querySelector('.ghost[href], a[href^="http"]');
    if (link) attachLogoImage(logo, link.href, title.textContent.trim());
    const copy = document.createElement('div');
    copy.className = 'compact-copy';
    while (info.firstChild) {
      copy.appendChild(info.firstChild);
    }
    wrap.appendChild(logo);
    wrap.appendChild(copy);
    info.appendChild(wrap);
  };

  const enhanceAllCards = () => {
    document.querySelectorAll('.tool-card,.quick-card,.card').forEach(enhanceCard);
  };

  let scheduled = false;
  const scheduleEnhance = () => {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(() => {
      scheduled = false;
      enhanceAllCards();
    });
  };

  new MutationObserver(scheduleEnhance).observe(document.body, { childList: true, subtree: true });
  scheduleEnhance();
})();
</script></body>
