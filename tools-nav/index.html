  <script>
    const labels = { allType:"\u5168\u90e8\u7c7b\u578b", allStatus:"\u5168\u90e8\u72b6\u6001", allScene:"\u5168\u90e8\u573a\u666f", showing:"\u5f53\u524d\u663e\u793a", items:"\u4e2a\u5de5\u5177", open:"\u6253\u5f00", pending:"\u7b79\u5907\u4e2d", noMatch:"\u6ca1\u6709\u627e\u5230\u5339\u914d\u7684\u5de5\u5177\uff0c\u6362\u4e2a\u5173\u952e\u8bcd\u6216\u7b5b\u9009\u8bd5\u8bd5\u3002" };
    const tools = [
      { name:"AsterLab \u5de5\u5177\u7bb1", type:"\u901a\u7528\u5de5\u5177", status:"\u5df2\u4e0a\u7ebf", scene:"\u6548\u7387\u5de5\u5177", badge:"\u5de5\u5177\u7ad9", accent:"#10b981", score:5, summary:"\u5df2\u6709\u7684\u901a\u7528\u5de5\u5177\u5de5\u4f5c\u53f0\uff0c\u9002\u5408\u6587\u672c\u3001JSON\u3001Markdown\u3001PDF \u4e4b\u7c7b\u7684\u5904\u7406\u3002", note:"\u9700\u8981\u76f4\u63a5\u7528\u5de5\u5177\u65f6\u5c31\u8fdb\u8fd9\u4e2a\u3002", tags:["\u5de5\u5177\u7bb1","\u6587\u672c","JSON","PDF"], url:"/asterlab-tools/" }
    ];
    const types = [labels.allType,"\u901a\u7528\u5de5\u5177"];
    const statuses = [labels.allStatus,"\u5df2\u4e0a\u7ebf"];
    const scenes = [labels.allScene,"\u6548\u7387\u5de5\u5177"];
    const state = { type:labels.allType, status:labels.allStatus, scene:labels.allScene, search:"" };
    const typeChipsEl = document.getElementById("type-chips"), statusChipsEl = document.getElementById("status-chips"), sceneChipsEl = document.getElementById("scene-chips"), quickGridEl = document.getElementById("quick-grid"), gridEl = document.getElementById("grid"), countEl = document.getElementById("count"), searchEl = document.getElementById("search-input");
    const renderChipGroup = (container, values, key, current) => container.innerHTML = values.map((value) => `<button class="chip-btn ${value === current ? "active" : ""}" data-${key}="${value}" type="button">${value}</button>`).join("");
    function renderChips() { renderChipGroup(typeChipsEl, types, "type", state.type); renderChipGroup(statusChipsEl, statuses, "status", state.status); renderChipGroup(sceneChipsEl, scenes, "scene", state.scene); }
    function filteredTools() { return tools.filter((tool) => { const haystack = [tool.name, tool.type, tool.status, tool.scene, tool.summary, tool.note, ...(tool.tags || [])].join(" ").toLowerCase(); return (state.type === labels.allType || tool.type === state.type) && (state.status === labels.allStatus || tool.status === state.status) && (state.scene === labels.allScene || tool.scene === state.scene) && (!state.search || haystack.includes(state.search)); }); }
    function cardTemplate(tool) {
      const actions = tool.url ? `<div class="btn-row"><a class="visit" href="${tool.url}">${labels.open}</a></div>` : `<span class="disabled">${labels.pending}</span>`;
      return `<article class="tool-card" style="--tool-accent:${tool.accent}"><div class="tool-top"><div><div class="meta">${tool.type} / ${tool.scene}</div><h3>${tool.name}</h3></div><div class="btn-row"><span class="status-badge">${tool.status}</span><span class="badge">${tool.badge}</span></div></div><p>${tool.summary}</p><div class="tag-row">${(tool.tags || []).slice(0,5).map((tag) => `<span class="chip">${tag}</span>`).join("")}</div><div class="mini-list"><div><span>\u5f53\u524d\u72b6\u6001</span><strong>${tool.status}</strong></div><div><span>\u5de5\u5177\u8bf4\u660e</span><strong>${tool.note}</strong></div></div><div class="card-bottom"><span class="meta">${tool.url || "\u5373\u5c06\u52a0\u5165"}</span>${actions}</div></article>`;
    }
    function renderQuickGrid() { quickGridEl.innerHTML = tools.filter((tool) => tool.score >= 4).slice(0,4).map(cardTemplate).join(""); }
    function renderGrid() { const items = filteredTools(); countEl.textContent = `${labels.showing} ${items.length} / ${tools.length} ${labels.items}`; renderQuickGrid(); gridEl.innerHTML = items.length ? items.map(cardTemplate).join("") : `<div class="empty">${labels.noMatch}</div>`; }
    typeChipsEl.addEventListener("click", (event) => { const button = event.target.closest("[data-type]"); if (!button) return; state.type = button.dataset.type; renderChips(); renderGrid(); });
    statusChipsEl.addEventListener("click", (event) => { const button = event.target.closest("[data-status]"); if (!button) return; state.status = button.dataset.status; renderChips(); renderGrid(); });
