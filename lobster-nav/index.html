    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
    a{color:inherit;text-decoration:none}
    button,input{font:inherit}
    .shell{width:min(calc(100% - 24px),var(--max));margin:0 auto;padding:22px 0 40px}
    .nav,.toolbar,.section{background:var(--panel);border:1px solid var(--line);border-radius:20px}
    .nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 20px}
    .brand{font-weight:700;letter-spacing:-.03em}
    .nav-links{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted)}
    .nav-links a:hover,.nav-links a.active{color:var(--text)}
    .toolbar{margin-top:16px;padding:18px}
    .toolbar-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
    .toolbar-head h1{margin:0;font-size:clamp(1.9rem,3.8vw,2.6rem);letter-spacing:-.05em}
    .toolbar-head p{margin:10px 0 0;max-width:52rem;color:var(--muted);line-height:1.7}
    .count{display:inline-flex;align-items:center;min-height:38px;padding:0 14px;border-radius:999px;border:1px solid rgba(196,143,90,.2);background:#fbf5ef;color:#8a6238;font-size:.92rem}
    .search{margin-top:16px}
    .search input{width:100%;min-height:50px;padding:0 16px;border-radius:var(--radius-md);border:1px solid var(--line);background:#fff;color:var(--text)}
    .filter-stack{display:grid;gap:10px;margin-top:14px}
    .filter-row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
    .filter-label{min-width:72px;padding-top:8px;color:var(--muted);font-size:.92rem}
    .chips{display:flex;flex-wrap:wrap;gap:8px;flex:1}
    .chip-btn{padding:9px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;transition:160ms ease}
    .chip-btn.active,.chip-btn:hover{background:#fbf5ef;border-color:rgba(196,143,90,.28);color:#8a6238}
    .section{margin-top:16px;padding:18px}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:14px}
    .section-head h2{margin:0;font-size:1.24rem;letter-spacing:-.04em}
    .section-head p{margin:6px 0 0;color:var(--muted);line-height:1.65}
    .grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
    .item-card{display:grid;gap:10px;padding:14px;border-radius:var(--radius-lg);border:1px solid transparent;background:#fff;transition:160ms ease}
    .item-card:hover{border-color:rgba(196,143,90,.18);box-shadow:0 10px 24px rgba(15,23,42,.05);transform:translateY(-1px)}
    .item-head{display:flex;align-items:flex-start;gap:10px}
    .logo{width:32px;height:32px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#7a5531;background:var(--logo-bg,#fbf5ef);border:1px solid rgba(196,143,90,.18);flex:none}
    .item-head h3{margin:0;font-size:1rem;line-height:1.28;letter-spacing:-.02em}
    .meta{margin:2px 0 0;color:var(--muted);font-size:.82rem}
    .summary{margin:0;color:var(--muted);font-size:.94rem;line-height:1.6}
    .tag-row{display:flex;flex-wrap:wrap;gap:8px}
    .chip{display:inline-flex;padding:6px 9px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:11px}
    .visit{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 12px;border-radius:999px;color:#8a6238;background:#f9ecdf;border:1px solid rgba(196,143,90,.24)}
    .card-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto}
    .host{color:var(--muted);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .empty{padding:20px;border-radius:var(--radius-lg);border:1px dashed var(--line);color:var(--muted);text-align:center}
    @media (max-width:1180px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
    @media (max-width:980px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media (max-width:720px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.nav{flex-direction:column;align-items:flex-start}.filter-row{flex-direction:column;gap:10px}.filter-label{min-width:auto;padding-top:0}}
    @media (max-width:520px){.grid{grid-template-columns:1fr}}
  </style>
</head>

      {name:"WorkBuddy",logo:"W",category:"local",accent:"#8fd0c4",logoBg:"#effaf7",url:"https://workbuddy.ai/",summary:{zh:"AI 原生桌面智能体工作台。",en:"An AI-native desktop workspace."},tags:{zh:["工作台","本地"],en:["workspace","local"]}},

      {name:"悟空",logo:"悟",category:"local",accent:"#f2c38b",logoBg:"#fff5eb",url:"https://tongyi.aliyun.com/",summary:{zh:"阿里系企业级桌面智能体方向。",en:"An Alibaba-aligned enterprise desktop route."},tags:{zh:["阿里","企业"],en:["Alibaba","enterprise"]}},
      {name:"360 安全龙虾",logo:"360",category:"local",accent:"#f39b67",logoBg:"#fff1e6",url:"https://www.360.cn/",summary:{zh:"偏安全模式和本地部署。",en:"A safer, more local-first route."},tags:{zh:["安全","本地"],en:["security","local"]}},
      {name:"QoderWork",logo:"QW",category:"local",accent:"#9fd7b7",logoBg:"#eef9f2",url:"https://qoder.com/",summary:{zh:"偏开发与本地工作流。",en:"A more coding- and local-workflow-oriented route."},tags:{zh:["开发","工作流"],en:["coding","workflow"]}},
      {name:"阶跃桌面伙伴",logo:"JP",category:"local",accent:"#8fb8ff",logoBg:"#edf4ff",url:"https://stepfun.ai/",summary:{zh:"桌面 Agent 形态。",en:"A desktop agent-shaped product."},tags:{zh:["桌面","Agent"],en:["desktop","agent"]}},
      {name:"JVS Claw",logo:"J",category:"local",accent:"#b98cf2",logoBg:"#f6f0ff",url:"https://www.aliyun.com/",summary:{zh:"多 Agent 协作平台入口。",en:"A multi-agent collaboration route."},tags:{zh:["协作","多 Agent"],en:["collaboration","multi-agent"]}},
      {name:"EasyClaw",logo:"EC",category:"local",accent:"#f39b67",logoBg:"#fff1e6",url:"https://easyclaw.ai/",summary:{zh:"偏一键部署网关与技能配置。",en:"A simpler gateway and skills setup path."},tags:{zh:["网关","技能"],en:["gateway","skills"]}},
      {name:"CoPaw",logo:"CP",category:"local",accent:"#f2c38b",logoBg:"#fff5eb",url:"https://copaw.ai/",summary:{zh:"协同个人工作台方向。",en:"A collaborative personal workspace route."},tags:{zh:["协同","工作台"],en:["collaboration","workspace"]}},
      {name:"Tabbit 浏览器",logo:"TB",category:"local",accent:"#f0b78b",logoBg:"#fff3e9",url:"https://tabbit.ai/",summary:{zh:"把网页、截图和文件接进对话。",en:"A browser route for bringing tabs, screenshots, and files into chat."},tags:{zh:["浏览器","截图"],en:["browser","screenshots"]}},
      {name:"Manus",logo:"MN",category:"platform",accent:"#9fd7b7",logoBg:"#eef9f2",url:"https://manus.im/",summary:{zh:"任务规划到执行的一站式 Agent 平台。",en:"An end-to-end task-planning agent platform."},tags:{zh:["Agent","平台"],en:["agent","platform"]}},
      {name:"牛马 AI",logo:"牛",category:"local",accent:"#8fd0c4",logoBg:"#effaf7",url:"https://niuma.ai/",summary:{zh:"偏本地免费版和实用办公助手。",en:"A more utilitarian local office helper route."},tags:{zh:["办公","本地"],en:["office","local"]}},
      {name:"MuleRun",logo:"MR",category:"platform",accent:"#8fb8ff",logoBg:"#edf4ff",url:"https://mulerun.ai/",summary:{zh:"AI 平台与自动化路线。",en:"An automation-focused AI platform route."},tags:{zh:["自动化","平台"],en:["automation","platform"]}},

      {name:"Loomy",logo:"LO",category:"local",accent:"#f2c38b",logoBg:"#fff5eb",url:"https://loomy.ai/",summary:{zh:"个人桌面 AI 助手方向。",en:"A personal desktop AI helper route."},tags:{zh:["桌面","个人"],en:["desktop","personal"]}},
      {name:"Linkfox Claw",logo:"LF",category:"platform",accent:"#f39b67",logoBg:"#fff1e6",url:"https://linkfox.ai/",summary:{zh:"一键部署 OpenClaw 的平台入口。",en:"A hosted platform route for one-click OpenClaw deployment."},tags:{zh:["部署","平台"],en:["deployment","platform"]}},

      {name:"KiloClaw",logo:"K",category:"platform",accent:"#f2c38b",logoBg:"#fff5eb",url:"https://kiloclaw.ai/",summary:{zh:"面向开发者和团队的托管服务。",en:"A managed service for developers and teams."},tags:{zh:["团队","托管"],en:["team","managed"]}},
      {name:"NemoClaw",logo:"N",category:"platform",accent:"#9fd7b7",logoBg:"#eef9f2",url:"https://www.nvidia.com/",summary:{zh:"企业级开源 AI 平台路线。",en:"An enterprise-oriented open AI platform route."},tags:{zh:["企业","平台"],en:["enterprise","platform"]}},
      {name:"DeskClaw",logo:"D",category:"local",accent:"#f1bc8a",logoBg:"#fff5eb",url:"https://deskclaw.ai/",summary:{zh:"桌面 AI 同事形态。",en:"A desktop AI coworker direction."},tags:{zh:["桌面","同事"],en:["desktop","coworker"]}}
    ];

    const state = { category:"all", search:"" };
    const categoryEl = document.getElementById("category-chips");
    const gridEl = document.getElementById("grid");
    const countEl = document.getElementById("count");
    const brandEl = document.getElementById("brand");
    const searchEl = document.getElementById("search-input");

    function optionText(lang, key){
      return key === "all" ? labels[lang].allCategory : categories[key][lang];
    }

    function renderChips(lang){
      const values = ["all", ...Object.keys(categories)];
      categoryEl.innerHTML = values.map((value) => `<button class="chip-btn ${value===state.category?"active":""}" data-category="${value}" type="button">${optionText(lang, value)}</button>`).join("");
    }

    function hostLabel(url){
      try{
        const parsed = new URL(url);
        return parsed.host;
      }catch{
        return url;
      }
    }

    function filteredItems(lang){
      return items.filter((item) => {
        const haystack = [item.name, item.summary[lang], categories[item.category][lang], ...item.tags[lang]].join(" ").toLowerCase();
        return (state.category === "all" || item.category === state.category) && (!state.search || haystack.includes(state.search));
      });
    }

    function cardTemplate(item, lang){
      return `<article class="item-card" style="--item-accent:${item.accent};--logo-bg:${item.logoBg}">
        <div class="item-head">
          <span class="logo">${item.logo}</span>
          <div>
            <h3>${item.name}</h3>
            <div class="meta">${categories[item.category][lang]}</div>
          </div>
        </div>
        <p class="summary">${item.summary[lang]}</p>
        <div class="tag-row">${item.tags[lang].map((tag)=>`<span class="chip">${tag}</span>`).join("")}</div>
        <div class="card-bottom">
          <span class="host">${hostLabel(item.url)}</span>
          <a class="visit" href="${item.url}" target="_blank" rel="noreferrer">${labels[lang].open}</a>
        </div>
      </article>`;
    }

    function renderPage(lang){
      brandEl.textContent = labels[lang].brand;
      searchEl.placeholder = labels[lang].searchPlaceholder;
      renderChips(lang);
      const visible = filteredItems(lang);
      countEl.textContent = `${labels[lang].showing} ${visible.length} / ${items.length} ${labels[lang].items}`;
      gridEl.innerHTML = visible.length ? visible.map((item)=>cardTemplate(item, lang)).join("") : `<div class="empty">${labels[lang].noMatch}</div>`;
    }

    document.body.addEventListener("click", (event) => {
      const button = event.target.closest("[data-category]");
      if(!button) return;
      state.category = button.dataset.category;
      renderPage(window.SiteI18n.getLang());
    });

    searchEl.addEventListener("input", () => {
      state.search = searchEl.value.trim().toLowerCase();
      renderPage(window.SiteI18n.getLang());
    });

    window.SiteI18n.bindPage(pageCopy, renderPage);
  </script>
</body>
</html>
