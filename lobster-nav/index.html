<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小龙虾导航 | 88220066.xyz</title>
  <meta name="description" content="围绕 OpenClaw 与相关生态的中文导航页，按产品、云端部署、教程、常用 AI、Coding Plan 和 MaaS 平台整理。">
  <script src="/notes/site-i18n.js"></script>
  <style>
    :root{--bg:#f8fafc;--panel:#ffffff;--line:rgba(15,23,42,.08);--text:#0f172a;--muted:#64748b;--accent:#c48f5a;--accent-soft:rgba(196,143,90,.14);--radius-xl:24px;--radius-lg:18px;--radius-md:14px;--max:1180px}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
    a{color:inherit;text-decoration:none}
    button,input{font:inherit}
    .shell{width:min(calc(100% - 28px),var(--max));margin:0 auto;padding:24px 0 48px}
    .nav,.toolbar,.section{background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:none}
    .nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 22px}
    .brand{font-weight:700;letter-spacing:-.03em}
    .nav-links{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted)}
    .nav-links a:hover,.nav-links a.active{color:var(--text)}
    .toolbar{margin-top:18px;padding:20px}
    .toolbar-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
    .toolbar-head h1{margin:0;font-size:clamp(2rem,4vw,2.8rem);letter-spacing:-.05em}
    .toolbar-head p{margin:10px 0 0;max-width:54rem;color:var(--muted);line-height:1.75}
    .count{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid rgba(196,143,90,.2);background:#fbf5ef;color:#8a6238;font-size:.94rem}
    .search{margin-top:18px}
    .search input{width:100%;min-height:52px;padding:0 16px;border-radius:var(--radius-md);border:1px solid var(--line);background:#fff;color:var(--text)}
    .filter-stack{display:grid;gap:12px;margin-top:16px}
    .filter-row{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
    .filter-label{min-width:84px;padding-top:8px;color:var(--muted);font-size:.94rem}
    .chips{display:flex;flex-wrap:wrap;gap:10px;flex:1}
    .chip-btn{padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;transition:160ms ease}
    .chip-btn.active,.chip-btn:hover{background:#fbf5ef;border-color:rgba(196,143,90,.28);color:#8a6238}
    .section{margin-top:18px;padding:22px}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px}
    .section-head h2{margin:0;font-size:1.4rem;letter-spacing:-.04em}
    .section-head p{margin:8px 0 0;color:var(--muted);line-height:1.7}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .link-card{position:relative;display:grid;gap:14px;padding:18px;border-radius:var(--radius-lg);border:1px solid var(--line);background:#fff;transition:160ms ease}
    .link-card::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;border-radius:var(--radius-lg) 0 0 var(--radius-lg);background:var(--item-accent,var(--accent));opacity:.82}
    .link-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(15,23,42,.06)}
    .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .meta,.link-card p{margin:0;color:var(--muted);line-height:1.72}
    .link-card h3{margin:4px 0 0;font-size:1.12rem}
    .badge{display:inline-flex;align-items:center;justify-content:center;min-height:30px;padding:0 10px;border-radius:999px;font-size:12px;background:#fbf5ef;border:1px solid rgba(196,143,90,.22);color:#8a6238}
    .tag-row{display:flex;flex-wrap:wrap;gap:8px}
    .chip{display:inline-flex;padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:12px}
    .card-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto;flex-wrap:wrap}
    .visit{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 14px;border-radius:999px;color:#8a6238;background:#f9ecdf;border:1px solid rgba(196,143,90,.24)}
    .empty{padding:20px;border-radius:var(--radius-lg);border:1px dashed var(--line);color:var(--muted);text-align:center}
    @media (max-width:820px){.grid{grid-template-columns:1fr}.filter-row{flex-direction:column;gap:10px}.filter-label{min-width:auto;padding-top:0}.nav{flex-direction:column;align-items:flex-start}}
  </style>
</head>
<body data-i18n-title="pageTitle" data-i18n-description="pageDescription">
  <div class="shell">
    <header class="nav">
      <div class="brand" id="brand">88220066.xyz / 小龙虾导航</div>
      <nav class="nav-links" aria-label="Primary">
        <a href="/" data-i18n="navHome">首页</a>
        <a href="/ai-nav/" data-i18n="navAi">AI 导航</a>
        <a href="/lobster-nav/" class="active" data-i18n="navLobster">小龙虾导航</a>
      </nav>
    </header>

    <section class="toolbar">
      <div class="toolbar-head">
        <div>
          <h1 data-i18n="heroTitle">小龙虾导航</h1>
          <p data-i18n="heroCopy">围绕 OpenClaw 生态，把常见产品、云端部署入口、教程资料、常用 AI、Coding Plan 和 MaaS 平台整理到一页里。</p>
        </div>
        <div class="count" id="count">加载中</div>
      </div>
      <label class="search">
        <input id="search-input" type="search">
      </label>
      <div class="filter-stack">
        <div class="filter-row">
          <div class="filter-label" data-i18n="filterCategory">栏目</div>
          <div id="category-chips" class="chips"></div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <div>
          <h2 data-i18n="listTitle">导航列表</h2>
          <p data-i18n="listCopy">按栏目和关键词筛选，只保留适合直接打开继续看的入口。</p>
        </div>
      </div>
      <div id="grid" class="grid"></div>
    </section>
  </div>

  <script>
    const pageCopy = {
      pageTitle:{zh:"小龙虾导航 | 88220066.xyz",en:"Lobster Nav | 88220066.xyz"},
      pageDescription:{zh:"围绕 OpenClaw 与相关生态的中文导航页，按产品、云端部署、教程、常用 AI、Coding Plan 和 MaaS 平台整理。",en:"A compact directory for the OpenClaw ecosystem, organized by products, cloud deployment, docs, AI tools, coding plans, and MaaS platforms."},
      navHome:{zh:"首页",en:"Home"},
      navAi:{zh:"AI 导航",en:"AI Nav"},
      navLobster:{zh:"小龙虾导航",en:"Lobster Nav"},
      heroTitle:{zh:"小龙虾导航",en:"Lobster Nav"},
      heroCopy:{zh:"围绕 OpenClaw 生态，把常见产品、云端部署入口、教程资料、常用 AI、Coding Plan 和 MaaS 平台整理到一页里。",en:"A compact OpenClaw ecosystem directory covering products, cloud deployment, docs, popular AI tools, coding plans, and MaaS platforms."},
      filterCategory:{zh:"栏目",en:"Category"},
      listTitle:{zh:"导航列表",en:"Directory"},
      listCopy:{zh:"按栏目和关键词筛选，只保留适合直接打开继续看的入口。",en:"Filter by category and keyword. This page keeps links that are worth opening directly."}
    };

    const labels = {
      zh:{
        brand:"88220066.xyz / 小龙虾导航",
        searchPlaceholder:"搜索产品名、平台名、标签或说明，例如：云端、部署、教程、MaaS、Coding",
        allCategory:"全部栏目",
        showing:"当前显示",
        items:"个入口",
        open:"打开",
        noMatch:"没有找到匹配内容，换个关键词或栏目试试。"
      },
      en:{
        brand:"88220066.xyz / Lobster Nav",
        searchPlaceholder:"Search by product, platform, or keyword: cloud, deploy, docs, MaaS, coding",
        allCategory:"All Categories",
        showing:"Showing",
        items:"links",
        open:"Open",
        noMatch:"No matching items found. Try another keyword or category."
      }
    };

    const categories = {
      products:{zh:"百虾大战",en:"Products"},
      cloud:{zh:"云端部署",en:"Cloud Deploy"},
      docs:{zh:"教程合集",en:"Docs"},
      ai:{zh:"常用 AI",en:"Popular AI"},
      coding:{zh:"Coding Plan",en:"Coding Plan"},
      maas:{zh:"MaaS 平台",en:"MaaS"}
    };

    const items = [
      {name:"OpenClaw 官网",category:"products",accent:"#b98cf2",url:"https://openclaw.ai/",summary:{zh:"OpenClaw 官方主页，适合先看产品定位和官方入口。",en:"Official OpenClaw homepage and the best place to start."},tags:{zh:["官网","开源","产品"],en:["official","open source","product"]}},
      {name:"官方 GitHub",category:"products",accent:"#89b8f5",url:"https://github.com/openclaw/openclaw",summary:{zh:"源代码、Issue 和更新记录都在这里。",en:"Source code, issues, and updates in one place."},tags:{zh:["GitHub","源码","更新"],en:["GitHub","source","updates"]}},
      {name:"Kimi Claw",category:"products",accent:"#8fd0c4",url:"https://www.kimi.com/",summary:{zh:"云端版思路的典型入口，适合先看产品化体验。",en:"A representative hosted product experience."},tags:{zh:["云端","产品","体验"],en:["cloud","product","experience"]}},
      {name:"MaxClaw",category:"products",accent:"#f1bc8a",url:"https://agent.minimaxi.com/",summary:{zh:"偏一键开通和托管使用的入口。",en:"A one-click hosted route."},tags:{zh:["托管","开通","云端"],en:["hosted","quick start","cloud"]}},
      {name:"飞书 OpenClaw",category:"products",accent:"#8fb8ff",url:"https://openclaw.feishu.cn/",summary:{zh:"飞书体系下的云端 OpenClaw 入口。",en:"Hosted OpenClaw inside the Feishu ecosystem."},tags:{zh:["飞书","云端","协作"],en:["Feishu","cloud","collaboration"]}},
      {name:"腾讯云",category:"cloud",accent:"#9fd7b7",url:"https://cloud.tencent.com/",summary:{zh:"适合把 OpenClaw 放到长期在线的云主机上。",en:"A practical option for always-on deployment."},tags:{zh:["云服务器","部署","长期在线"],en:["cloud server","deploy","always on"]}},
      {name:"阿里云",category:"cloud",accent:"#f2c38b",url:"https://www.aliyun.com/",summary:{zh:"偏国内云端部署和企业环境。",en:"Useful for China-based cloud deployment and enterprise use."},tags:{zh:["阿里云","国内","部署"],en:["Alibaba Cloud","China","deploy"]}},
      {name:"火山引擎",category:"cloud",accent:"#f3a38e",url:"https://www.volcengine.com/",summary:{zh:"适合接 MaaS 和部署能力一起看。",en:"Worth checking when you want both hosting and model services."},tags:{zh:["火山","部署","模型"],en:["Volcengine","deployment","models"]}},
      {name:"百度智能云",category:"cloud",accent:"#8fb8ff",url:"https://cloud.baidu.com/",summary:{zh:"国内云部署和 AI 平台能力都比较完整。",en:"A more integrated cloud-and-AI route."},tags:{zh:["百度云","部署","平台"],en:["Baidu Cloud","deploy","platform"]}},
      {name:"官方文档",category:"docs",accent:"#b98cf2",url:"https://docs.openclaw.ai/",summary:{zh:"正式文档入口，适合查安装、配置和网关能力。",en:"Primary documentation for install, config, and gateway features."},tags:{zh:["文档","安装","配置"],en:["docs","install","config"]}},
      {name:"OpenClaw 橙皮书",category:"docs",accent:"#f1bc8a",url:"https://my.feishu.cn/",summary:{zh:"偏中文整理视角，适合快速扫概念。",en:"A Chinese-oriented knowledge summary."},tags:{zh:["中文","知识库","入门"],en:["Chinese","knowledge base","intro"]}},
      {name:"WaytoAGI",category:"docs",accent:"#9fd7b7",url:"https://waytoagi.feishu.cn/",summary:{zh:"社区知识库入口，适合继续延伸看。",en:"A broader community knowledge base for follow-up reading."},tags:{zh:["社区","知识库","延伸"],en:["community","knowledge base","follow-up"]}},
      {name:"Datawhale 教程",category:"docs",accent:"#8fd0c4",url:"https://datawhalechina.github.io/",summary:{zh:"适合用教程方式从零了解。",en:"A tutorial-style route for learning from scratch."},tags:{zh:["教程","从零开始","实践"],en:["tutorial","from scratch","practice"]}},
      {name:"Qwen",category:"ai",accent:"#f2c38b",url:"https://www.qianwen.com/",summary:{zh:"国内常见 AI 入口，适合日常对话和测试。",en:"A mainstream China-focused AI assistant."},tags:{zh:["大模型","聊天","国内"],en:["LLM","chat","China"]}},
      {name:"豆包",category:"ai",accent:"#8fb8ff",url:"https://www.doubao.com/",summary:{zh:"国内常用 AI 助手之一。",en:"A commonly used Chinese AI assistant."},tags:{zh:["AI 助手","聊天","中文"],en:["assistant","chat","Chinese"]}},
      {name:"Kimi",category:"ai",accent:"#8fd0c4",url:"https://www.kimi.com/",summary:{zh:"适合长文本和中文资料整理。",en:"Useful for long-context Chinese workflows."},tags:{zh:["长文本","中文","整理"],en:["long context","Chinese","summary"]}},
      {name:"DeepSeek",category:"ai",accent:"#b98cf2",url:"https://chat.deepseek.com/",summary:{zh:"国内推理和开发场景里常被一起比较。",en:"Frequently compared in reasoning and coding scenarios."},tags:{zh:["推理","代码","模型"],en:["reasoning","coding","model"]}},
      {name:"Kimi Coding Plan",category:"coding",accent:"#f1bc8a",url:"https://www.kimi.com/",summary:{zh:"偏 AI 编程使用权益和套餐视角。",en:"A coding-focused subscription route."},tags:{zh:["编程","套餐","权益"],en:["coding","plan","subscription"]}},
      {name:"MiniMax Coding Plan",category:"coding",accent:"#9fd7b7",url:"https://platform.minimaxi.com/",summary:{zh:"适合看编程套餐和模型能力组合。",en:"Useful when comparing coding-oriented plans and models."},tags:{zh:["编程","模型","计划"],en:["coding","models","plan"]}},
      {name:"智谱 Coding Plan",category:"coding",accent:"#8fb8ff",url:"https://bigmodel.cn/",summary:{zh:"国内 Coding Plan 路线的一类代表。",en:"A representative China-based coding-plan option."},tags:{zh:["GLM","编程","国内"],en:["GLM","coding","China"]}},
      {name:"阿里云百炼",category:"maas",accent:"#f2c38b",url:"https://bailian.console.aliyun.com/",summary:{zh:"国内 MaaS 平台代表，模型和应用能力都比较全。",en:"A representative MaaS platform with broad model and app support."},tags:{zh:["MaaS","阿里云","平台"],en:["MaaS","Alibaba Cloud","platform"]}},
      {name:"火山方舟",category:"maas",accent:"#f3a38e",url:"https://www.volcengine.com/",summary:{zh:"偏模型训练、推理、评测的一站式平台。",en:"A one-stop platform for training, inference, and evaluation."},tags:{zh:["MaaS","推理","训练"],en:["MaaS","inference","training"]}},
      {name:"百度千帆",category:"maas",accent:"#8fb8ff",url:"https://cloud.baidu.com/",summary:{zh:"企业级大模型服务与应用开发平台。",en:"An enterprise-oriented model service and app platform."},tags:{zh:["千帆","企业","平台"],en:["Qianfan","enterprise","platform"]}},
      {name:"OpenRouter",category:"maas",accent:"#b98cf2",url:"https://openrouter.ai/",summary:{zh:"模型聚合入口，适合统一 API 调用。",en:"A model aggregation route with a unified API layer."},tags:{zh:["聚合","API","模型"],en:["aggregation","API","models"]}}
    ];

    const state = { category:"all", search:"" };
    const categoryEl = document.getElementById("category-chips");
    const gridEl = document.getElementById("grid");
    const countEl = document.getElementById("count");
    const brandEl = document.getElementById("brand");
    const searchEl = document.getElementById("search-input");

    function optionText(lang, key){
      return key === "all" ? labels[lang].allCategory : categories[key][lang];
    }

    function renderChips(lang){
      const values = ["all", ...Object.keys(categories)];
      categoryEl.innerHTML = values.map((value) => `<button class="chip-btn ${value===state.category?"active":""}" data-category="${value}" type="button">${optionText(lang, value)}</button>`).join("");
    }

    function hostLabel(url){
      try{
        const parsed = new URL(url);
        return `${parsed.host}${parsed.pathname === "/" ? "" : parsed.pathname}`;
      }catch{
        return url;
      }
    }

    function filteredItems(lang){
      return items.filter((item) => {
        const haystack = [item.name, item.summary[lang], categories[item.category][lang], ...item.tags[lang]].join(" ").toLowerCase();
        return (state.category === "all" || item.category === state.category) && (!state.search || haystack.includes(state.search));
      });
    }

    function cardTemplate(item, lang){
      return `<article class="link-card" style="--item-accent:${item.accent}">
        <div class="card-top">
          <div>
            <div class="meta">${categories[item.category][lang]}</div>
            <h3>${item.name}</h3>
          </div>
          <span class="badge">${categories[item.category][lang]}</span>
        </div>
        <p>${item.summary[lang]}</p>
        <div class="tag-row">${item.tags[lang].map((tag)=>`<span class="chip">${tag}</span>`).join("")}</div>
        <div class="card-bottom">
          <span class="meta">${hostLabel(item.url)}</span>
          <a class="visit" href="${item.url}" target="_blank" rel="noreferrer">${labels[lang].open}</a>
        </div>
      </article>`;
    }

    function renderPage(lang){
      brandEl.textContent = labels[lang].brand;
      searchEl.placeholder = labels[lang].searchPlaceholder;
      renderChips(lang);
      const visible = filteredItems(lang);
      countEl.textContent = `${labels[lang].showing} ${visible.length} / ${items.length} ${labels[lang].items}`;
      gridEl.innerHTML = visible.length ? visible.map((item)=>cardTemplate(item, lang)).join("") : `<div class="empty">${labels[lang].noMatch}</div>`;
    }

    document.body.addEventListener("click", (event) => {
      const button = event.target.closest("[data-category]");
      if(!button) return;
      state.category = button.dataset.category;
      renderPage(window.SiteI18n.getLang());
    });

    searchEl.addEventListener("input", () => {
      state.search = searchEl.value.trim().toLowerCase();
      renderPage(window.SiteI18n.getLang());
    });

    window.SiteI18n.bindPage(pageCopy, renderPage);
  </script>
</body>
</html>
