      },
      openNow: { zh: "\u5728\u65B0\u9875\u9762\u6253\u5F00", en: "Open In New Page" }

    const projects = [
      {
        id: "ai",
        icon: "AI",
        color: "#6f5cff",
        soft: "rgba(111,92,255,.12)",
        type: { zh: "AI \u5BFC\u822A", en: "AI Nav" },

      {

        short: {

        },

        frameTitle: { zh: "API \u5185\u5D4C\u89C6\u56FE", en: "API embedded view" }
      },
      {
        id: "ranking",
        icon: "R",
        color: "#f59e0b",
        soft: "rgba(245,158,11,.12)",
        type: { zh: "\u6A21\u578B\u6392\u540D", en: "Model Rankings" },
        name: { zh: "\u6A21\u578B\u6392\u540D", en: "Model Rankings" },
        short: {
          zh: "\u6BCF\u65E5\u770B\u516C\u5F00\u6A21\u578B\u699C\u5355\uFF0C\u5206\u5F00\u5F00\u6E90\u548C\u95ED\u6E90\u3002",
          en: "A daily-updated view of public model rankings, split into open and closed models."
        },
        path: "/model-ranking/",
        frameTitle: { zh: "\u6A21\u578B\u6392\u540D\u5185\u5D4C\u89C6\u56FE", en: "Model ranking embedded view" }
      },
      {
        id: "finance",
        icon: "F",
        color: "#14b8a6",
        soft: "rgba(20,184,166,.12)",
        type: { zh: "\u91D1\u878D\u5BFC\u822A", en: "Finance Nav" },
        name: { zh: "\u91D1\u878D\u5BFC\u822A", en: "Finance Nav" },
        short: {
          zh: "\u7406\u8D22\u3001\u91CF\u5316\u3001\u5B8F\u89C2\u6570\u636E\u3001\u516C\u53F8\u62AB\u9732\u548C\u516C\u5F00 API \u5165\u53E3\u3002",
          en: "Free links for investing, quant research, macro data, filings, and finance APIs."
        },
        path: "/finance-nav/",
        frameTitle: { zh: "\u91D1\u878D\u5BFC\u822A\u5185\u5D4C\u89C6\u56FE", en: "Finance embedded view" }

      {

        soft: "rgba(15,157,132,.12)",
        type: { zh: "\u5DE5\u5177", en: "Tools" },
        name: { zh: "\u5DE5\u5177", en: "Tools" },
        short: {
          zh: "\u805A\u5408 PDF\u3001\u56FE\u7247\u3001\u6587\u672C\u3001\u5F00\u53D1\u7B49\u7F51\u9875\u5DE5\u5177\u3002",
          en: "A directory of web tools for PDF, image, text, and development tasks."
        },
        path: "/tools-nav/",
        frameTitle: { zh: "\u5DE5\u5177\u5185\u5D4C\u89C6\u56FE", en: "Tools embedded view" }
      },
      {
        id: "english",
        icon: "E",
        color: "#ff8a34",
        soft: "rgba(255,138,52,.12)",
        type: { zh: "\u82F1\u8BED", en: "English" },
        name: { zh: "\u82F1\u8BED", en: "English" },
        short: {
          zh: "\u67E5\u8BCD\u3001\u542C\u529B\u3001\u9605\u8BFB\u3001\u53D1\u97F3\u548C\u82F1\u8BED\u8D44\u6E90\u5BFC\u822A\u3002",
          en: "A clean list of English-learning sites and official resources."
        },
        path: "/english-tools/",
        frameTitle: { zh: "\u82F1\u8BED\u5185\u5D4C\u89C6\u56FE", en: "English embedded view" }
      }
    ];

    const el = {
      list: document.getElementById("project-list"),
      type: document.getElementById("detail-type"),
      title: document.getElementById("detail-title"),
      path: document.getElementById("detail-path"),
      open: document.getElementById("detail-open"),
      frame: document.getElementById("detail-frame"),
      topbar: document.getElementById("viewer-topbar")
    };

    const state = { activeId: "ai", lang: "zh" };

    function t(key) {
      return copy[key]?.[state.lang] ?? "";
    }

    function getProject(id) {
      return projects.find((item) => item.id === id) || projects[0];
    }

    function renderList() {
      el.list.innerHTML = "";
      projects.forEach((project) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "project-item" + (project.id === state.activeId ? " active" : "");
        button.style.setProperty("--item-accent", project.color);
        button.style.setProperty("--item-soft", project.soft);
        button.innerHTML = `
          <div class="project-top">
            <span class="project-badge">
              <span class="project-icon">${project.icon}</span>
              <span class="project-type">${project.type[state.lang]}</span>
            </span>
            <span class="project-arrow">鈥?/span>
          </div>
          <div class="project-name">${project.name[state.lang]}</div>
          <p class="project-desc">${project.short[state.lang]}</p>
        `;
        button.addEventListener("click", () => {
          state.activeId = project.id;
          render();
        });
        el.list.appendChild(button);
      });
    }

    function renderDetail() {
      const project = getProject(state.activeId);
      el.topbar.style.setProperty("--viewer-accent", project.color);
      el.type.textContent = project.type[state.lang];
      el.title.textContent = project.name[state.lang];
      el.path.textContent = project.path;
      el.open.href = project.path;
      el.open.textContent = t("openNow");
      el.frame.src = project.path;
      el.frame.title = project.frameTitle[state.lang];
    }

    function render() {
      window.SiteI18n.applyMessages(copy, state.lang);
      renderList();
      renderDetail();
    }

    state.lang = window.SiteI18n.getLang();
    window.SiteI18n.bindPage(copy, (lang) => {
      state.lang = lang;
      render();
    });
  </script>
