        host: "www.behance.net"
      }
    ];

    const state = {
      lang: "zh",
      category: "all",
      search: ""
    };

    const navEl = document.getElementById("nav-links");
    const sectionsEl = document.getElementById("sections");
    const emptyEl = document.getElementById("empty-state");
    const searchMiniEl = document.getElementById("search-mini");
    const searchMainEl = document.getElementById("search-main");
    const focusBtn = document.getElementById("focus-search");
    const langButtons = [...document.querySelectorAll("[data-lang]")];

    function categoryLabel(id) {
      return categories.find((item) => item.id === id)?.label[state.lang] || "";
    }

    function sectionTitle(id) {
      return categories.find((item) => item.id === id)?.title[state.lang] || "";
    }

    function filteredResources() {
      const query = state.search.trim().toLowerCase();
      return resources.filter((item) => {
        const categoryPass = state.category === "all" || item.category === state.category;
        const haystack = [item.name, item.subtitle.zh, item.subtitle.en, item.summary.zh, item.summary.en, item.host].join(" ").toLowerCase();
        return categoryPass && (!query || haystack.includes(query));
      });
    }

    function applyMessages() {
      window.SiteI18n.applyMessages(messages, state.lang);
      const placeholder = state.lang === "zh"
        ? "搜索你想用的站点、工具或站内入口..."
        : "Search for websites, tools, or internal pages...";
      searchMiniEl.placeholder = placeholder;
      searchMainEl.placeholder = placeholder;
    }

    function renderLang() {
      langButtons.forEach((button) => {
        button.classList.toggle("active", button.dataset.lang === state.lang);
      });
    }

    function renderNav() {
      navEl.innerHTML = categories.map((item) => `
        <button class="nav-btn ${item.id === state.category ? "active" : ""}" type="button" data-category="${item.id}">
          ${item.label[state.lang]}
        </button>
      `).join("");
    }

    function renderSections() {
      const items = filteredResources();
      emptyEl.hidden = items.length > 0;

      if (items.length === 0) {
        sectionsEl.innerHTML = "";
        return;
      }

      const groups = state.category === "all"
        ? categories.filter((item) => item.id !== "all").map((item) => ({
            id: item.id,
            items: items.filter((resource) => resource.category === item.id)
          })).filter((group) => group.items.length)
        : [{ id: state.category, items }];

      sectionsEl.innerHTML = groups.map((group) => `
        <section class="section-card">
          <div class="section-head">
            <div>
              <h2>${sectionTitle(group.id)}</h2>
              <p>${state.lang === "zh" ? "保留常用入口和短说明，先找得到，再打开。" : "Keep the essentials visible: a short summary, a clear label, and one click to open."}</p>
            </div>
          </div>
          <div class="section-grid">
            ${group.items.map((item) => `
              <article class="tile">
                <div class="tile-top">
                  <div class="tile-icon">${item.icon}</div>
                  <div>
                    <h3>${item.name}</h3>
                    <div class="tile-meta">${item.subtitle[state.lang]}</div>
                  </div>
                </div>
                <p>${item.summary[state.lang]}</p>
                <div class="tile-bottom">
                  <span class="tile-host">${item.host}</span>
                  <a class="open" href="${item.url}" target="${item.url.startsWith("/") ? "_self" : "_blank"}" rel="noreferrer">${state.lang === "zh" ? "打开" : "Open"}</a>
                </div>
              </article>
            `).join("")}
          </div>
        </section>
      `).join("");
    }

    function syncSearch(value) {
      state.search = value;
      if (searchMiniEl.value !== value) searchMiniEl.value = value;
      if (searchMainEl.value !== value) searchMainEl.value = value;
      renderSections();
    }

    function bindEvents() {
      navEl.addEventListener("click", (event) => {
        const button = event.target.closest("[data-category]");
        if (!button) return;
        state.category = button.dataset.category;
        renderNav();
        renderSections();
      });

      langButtons.forEach((button) => {
        button.addEventListener("click", () => {
          state.lang = button.dataset.lang;
          window.SiteI18n.setLang(state.lang);
          render();
        });
      });

      searchMiniEl.addEventListener("input", (event) => syncSearch(event.target.value));
      searchMainEl.addEventListener("input", (event) => syncSearch(event.target.value));
      focusBtn.addEventListener("click", () => searchMainEl.focus());

      window.addEventListener("keydown", (event) => {
        if (event.key.toLowerCase() === "k" && (event.ctrlKey || event.metaKey)) {
          event.preventDefault();
          searchMainEl.focus();
        }
      });
    }

    function render() {
      applyMessages();
      renderLang();
      renderNav();
      renderSections();
    }

    state.lang = window.SiteI18n.getLang();
    window.SiteI18n.bindPage(messages, (lang) => {
      state.lang = lang;
      render();
    });

    bindEvents();
    render();
  </script>
</body>
</html>
