    const getProject=(id)=>projects.find((p)=>p.id===id)||projects[0];
    function renderList(){listEl.innerHTML="";projects.forEach((p)=>{const b=document.createElement("button");b.type="button";b.className="item"+(p.id===state.activeId?" active":"");b.style.setProperty("--accent",p.color);b.style.setProperty("--soft",p.soft);b.innerHTML='<div class="top"><span class="badge"><span class="icon">'+p.icon+'</span><span class="type">'+p.type[state.lang]+'</span></span><span class="type">&#8594;</span></div><div class="name">'+p.name[state.lang]+'</div><p class="desc">'+p.short[state.lang]+'</p>';b.addEventListener("click",()=>{state.activeId=p.id;render()});listEl.appendChild(b)})}
    function renderStage(){const p=getProject(state.activeId);stageEl.style.setProperty("--accent",p.color);stageEl.style.setProperty("--soft",p.soft);stageEl.innerHTML='<section class="hero"><span class="kicker">'+p.type[state.lang]+'</span><h2>'+p.name[state.lang]+'</h2><p>'+p.hero[state.lang]+'</p><div class="actions"><a class="btn" href="'+p.path+'" target="_self">'+msg("open")+'</a><a class="btn2" href="'+p.path+'" target="_blank" rel="noreferrer">'+msg("open2")+'</a></div></section><section class="grid"><article class="card"><div class="label">'+msg("meta1")+'</div><div class="value">'+p.type[state.lang]+'</div></article><article class="card"><div class="label">'+msg("meta2")+'</div><div class="value">'+p.path+'</div></article><article class="card"><div class="label">'+msg("meta3")+'</div><div class="value">'+p.update[state.lang]+'</div></article></section><section class="card"><h3 class="title">'+msg("focus")+'</h3><div class="focus">'+p.focus[state.lang].map((x)=>'<div class="focus-item"><span class="dot"></span><div>'+x+'</div></div>').join("")+'</div></section><section class="grid"><article class="card"><h3 class="title">'+msg("card1")+'</h3><p>'+p.blocks[state.lang][0]+'</p></article><article class="card"><h3 class="title">'+msg("card2")+'</h3><p>'+p.blocks[state.lang][1]+'</p></article><article class="card"><h3 class="title">'+msg("card3")+'</h3><p>'+p.blocks[state.lang][2]+'</p></article></section><section class="card"><div class="label">'+msg("meta4")+'</div><div class="value">'+p.fit[state.lang]+'</div></section>'}
    function renderLang(){langButtons.forEach((b)=>b.classList.toggle("active",b.dataset.lang===state.lang))}
    function render(){window.SiteI18n.applyMessages(messages,state.lang);renderLang();renderList();renderStage()}
    state.lang=window.SiteI18n.getLang();
    langButtons.forEach((b)=>b.addEventListener("click",()=>{state.lang=b.dataset.lang;window.SiteI18n.setLang(state.lang);render()}));
    window.SiteI18n.bindPage(messages,(lang)=>{state.lang=lang;render()});
  </script>
</body>
</html>
