    const state = {
      activeId: "ai",
      lang: "zh"
    };

    const listEl = document.getElementById("project-list");
    const stageEl = document.getElementById("stage");
    const langButtons = Array.from(document.querySelectorAll("[data-lang]"));

    function currentMessages(key) {
      return messages[key]?.[state.lang] ?? "";
    }

    function getProject(id) {
      return projects.find((project) => project.id === id) || projects[0];
    }

    function renderList() {
      listEl.innerHTML = "";
      projects.forEach((project) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "project-item" + (project.id === state.activeId ? " active" : "");
        button.style.setProperty("--item-accent", project.color);
        button.style.setProperty("--item-soft", project.soft);
        button.innerHTML = `
          <div class="project-top">
            <span class="project-badge">
              <span class="project-icon">${project.icon}</span>
              <span class="project-type">${project.type[state.lang]}</span>
            </span>
            <span class="project-arrow">鈫?/span>
          </div>
          <div class="project-name">${project.name[state.lang]}</div>
          <p class="project-desc">${project.short[state.lang]}</p>
        `;
        button.addEventListener("click", () => {
          state.activeId = project.id;
          render();
        });
        listEl.appendChild(button);
      });
    }

    function renderStage() {
      const project = getProject(state.activeId);
      stageEl.style.setProperty("--accent", project.color);
      stageEl.style.setProperty("--soft", project.soft);
      stageEl.innerHTML = `
        <section class="hero">
          <div class="hero-top">
            <div>
              <span class="hero-kicker">${project.type[state.lang]}</span>
              <h2>${project.name[state.lang]}</h2>
            </div>
          </div>
          <p class="hero-copy">${project.hero[state.lang]}</p>
          <div class="hero-actions">
            <a class="btn" href="${project.path}" target="_self">${currentMessages("openNow")}</a>
            <a class="btn-secondary" href="${project.path}" target="_blank" rel="noreferrer">${currentMessages("openAlt")}</a>
          </div>
        </section>

        <section class="meta-grid">
          <article class="meta-card">
            <div class="meta-label">${currentMessages("metaType")}</div>
            <div class="meta-value">${project.type[state.lang]}</div>
          </article>
          <article class="meta-card">
            <div class="meta-label">${currentMessages("metaPath")}</div>
            <div class="meta-value">${project.path}</div>
          </article>
          <article class="meta-card">
            <div class="meta-label">${currentMessages("metaUpdate")}</div>
            <div class="meta-value">${project.update[state.lang]}</div>
          </article>
        </section>

        <section class="meta-card">
          <h3 class="section-title">${currentMessages("focusTitle")}</h3>
          <p class="section-copy">${currentMessages("focusCopy")}</p>
          <div class="focus-list">
            ${project.focus[state.lang].map((item) => `
              <div class="focus-item">
                <span class="focus-dot"></span>
                <div class="focus-text">${item}</div>
              </div>
            `).join("")}
          </div>
        </section>

        <section class="card-grid">
          <article class="info-card">
            <h3>${currentMessages("cardTitle1")}</h3>
            <p>${project.blocks[state.lang][0]}</p>
          </article>
          <article class="info-card">
            <h3>${currentMessages("cardTitle2")}</h3>
            <p>${project.blocks[state.lang][1]}</p>
          </article>

            <h3>${currentMessages("cardTitle3")}</h3>
            <p>${project.blocks[state.lang][2]}</p>
          </article>
        </section>

        <section class="meta-card">
          <div class="meta-label">${currentMessages("metaFit")}</div>
          <div class="meta-value">${project.fit[state.lang]}</div>
        </section>
      `;
    }

    function renderLangButtons() {
      langButtons.forEach((button) => {
        button.classList.toggle("active", button.dataset.lang === state.lang);
      });
    }

    function render() {
      window.SiteI18n.applyMessages(messages, state.lang);
      renderLangButtons();
      renderList();
      renderStage();
    }

    state.lang = window.SiteI18n.getLang();

    langButtons.forEach((button) => {
      button.addEventListener("click", () => {
        const lang = button.dataset.lang;
        state.lang = lang;
        window.SiteI18n.setLang(lang);
        render();
      });
    });

    window.SiteI18n.bindPage(messages, (lang) => {
      state.lang = lang;
      render();
    });
  </script>
