<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>88220066.xyz</title>
    <meta name="description" content="Portal home for dictation, tools, and AI navigation.">
    <meta name="robots" content="index,follow">
    <meta name="theme-color" content="#ffffff">
    <meta property="og:type" content="website">
    <meta property="og:title" content="88220066.xyz">
    <meta property="og:url" content="https://88220066.xyz/">
    <meta property="og:site_name" content="88220066.xyz">
    <meta name="twitter:card" content="summary_large_image">
    <style>
        :root {
            --bg: #ffffff;
            --bg-soft: #fbfbfd;
            --text: #1d1d1f;
            --muted: #6e6e73;
            --line: rgba(15, 23, 42, 0.06);
            --blue: #0071e3;
            --blue-hover: #0077ed;
            --dictation: #ff8a34;
            --dictation-soft: rgba(255, 138, 52, 0.1);
            --tools: #0f9d84;
            --tools-soft: rgba(15, 157, 132, 0.1);
            --ai: #6f5cff;
            --ai-soft: rgba(111, 92, 255, 0.1);
            --max: 1180px;
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "PingFang SC", sans-serif;
            color: var(--text);
            background: linear-gradient(180deg, #ffffff 0%, var(--bg-soft) 100%);
        }

        a { color: inherit; text-decoration: none; }

        .shell {
            width: min(calc(100% - 40px), var(--max));
            margin: 0 auto;
        }

        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 20px 0;
            font-size: 0.94rem;
        }

        .brand {
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .nav-links {
            display: flex;
            gap: 22px;
            color: var(--muted);
            flex-wrap: wrap;
        }

        .nav-links a:hover {
            color: var(--text);
        }

        .lang-switch {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px;
            border-radius: 999px;
            border: 1px solid rgba(15, 23, 42, 0.08);
            background: rgba(255, 255, 255, 0.72);
        }

        .lang-btn {
            border: 0;
            background: transparent;
            color: var(--muted);
            padding: 7px 12px;
            border-radius: 999px;
            cursor: pointer;
        }

        .lang-btn.active {
            background: rgba(15, 23, 42, 0.08);
            color: var(--text);
        }

        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 112px 0 56px;
        }

        .actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 36px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 0 24px;
            border-radius: 999px;
            font-size: 0.99rem;
            transition: 180ms ease;
        }

        .button-primary {
            background: var(--blue);
            color: #fff;
        }

        .button-primary:hover {
            background: var(--blue-hover);
        }

        .button-secondary {
            color: var(--blue);
        }

        .button-secondary:hover {
            opacity: 0.78;
        }

        .links {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
            margin-top: 96px;
            width: 100%;
        }

        .link-card {
            position: relative;
            padding: 38px 34px 34px;
            border-radius: 32px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(15, 23, 42, 0.08);
            box-shadow: 0 18px 38px rgba(15, 23, 42, 0.06);
            text-align: center;
            transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease, background 180ms ease;
        }

        .link-card::before {
            content: "";
            position: absolute;
            inset: 0 auto 0 0;
            width: 5px;
            border-radius: 32px 0 0 32px;
            background: var(--card-accent, var(--blue));
        }

        .link-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 22px 48px rgba(15, 23, 42, 0.1);
        }

        .link-card h2 {
            margin: 0;
            font-size: clamp(1.6rem, 3vw, 2.2rem);
            letter-spacing: -0.05em;
        }

        .link-card p {
            margin: 14px auto 0;
            max-width: 22rem;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.75;
        }

        .link-card span {
            display: inline-block;
            margin-top: 18px;
            color: var(--blue);
            font-size: 0.96rem;
        }

        .link-card-dictation {
            --card-accent: var(--dictation);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), var(--dictation-soft));
            border-color: rgba(255, 138, 52, 0.26);
        }

        .link-card-tools {
            --card-accent: var(--tools);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), var(--tools-soft));
            border-color: rgba(15, 157, 132, 0.24);
        }

        .link-card-ai {
            --card-accent: var(--ai);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), var(--ai-soft));
            border-color: rgba(111, 92, 255, 0.24);
        }

        .footer {
            padding: 42px 0 24px;
            text-align: center;
            color: var(--muted);
            font-size: 0.92rem;
        }

        @media (max-width: 720px) {
            .shell {
                width: min(calc(100% - 24px), var(--max));
            }

            .nav {
                flex-direction: column;
                align-items: flex-start;
            }

            .nav-right {
                width: 100%;
                justify-content: space-between;
            }

            .hero {
                padding-top: 52px;
            }

            .links {
                grid-template-columns: 1fr;
                margin-top: 56px;
            }

            .link-card {
                text-align: left;
            }

            .link-card p {
                max-width: none;
                margin-left: 0;
                margin-right: 0;
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <header class="nav">
            <div class="brand">88220066.xyz</div>
            <div class="nav-right">
                <nav class="nav-links" aria-label="Primary">
                    <a href="/dictation/" data-i18n="nav_dictation"></a>
                    <a href="/asterlab-tools/" data-i18n="nav_tools"></a>
                    <a href="/ai-nav/" data-i18n="nav_ai"></a>
                </nav>
                <div class="lang-switch" aria-label="Language switch">
                    <button class="lang-btn" type="button" data-lang="zh">涓?/button>
                    <button class="lang-btn" type="button" data-lang="en">EN</button>
                </div>
            </div>
        </header>

        <main class="hero">
            <div class="actions">
                <a class="button button-primary" href="/dictation/" data-i18n="cta_dictation"></a>
                <a class="button button-secondary" href="/asterlab-tools/" data-i18n="cta_tools"></a>
                <a class="button button-secondary" href="/ai-nav/" data-i18n="cta_ai"></a>
            </div>

            <section class="links" aria-label="Quick links">
                <a class="link-card link-card-dictation" href="/dictation/">
                    <h2 data-i18n="card_dictation_title"></h2>
                    <p data-i18n="card_dictation_desc"></p>
                    <span>/dictation/</span>
                </a>
                <a class="link-card link-card-tools" href="/asterlab-tools/">
                    <h2 data-i18n="card_tools_title"></h2>
                    <p data-i18n="card_tools_desc"></p>
                    <span>/asterlab-tools/</span>
                </a>
                <a class="link-card link-card-ai" href="/ai-nav/">
                    <h2 data-i18n="card_ai_title"></h2>
                    <p data-i18n="card_ai_desc"></p>
                    <span>/ai-nav/</span>
                </a>
            </section>
        </main>

        <footer class="footer">88220066.xyz</footer>
    </div>

    <script>
        const HOME_I18N = {
            zh: {
                lang: "zh-CN",
                description: "\u6781\u7b80\u7684\u4e2a\u4eba\u4e3b\u9875\u5165\u53e3\uff0c\u76f4\u8fbe\u5355\u8bcd\u542c\u5199\u3001\u5de5\u5177\u7bb1\u548c AI \u5bfc\u822a\u3002",
                ogLocale: "zh_CN",
                nav_dictation: "\u5355\u8bcd\u542c\u5199",
                nav_tools: "\u5de5\u5177\u7bb1",
                nav_ai: "AI \u5bfc\u822a",
                cta_dictation: "\u542c\u5199",
                cta_tools: "\u5de5\u5177",
                cta_ai: "AI",
                card_dictation_title: "\u542c\u5199",
                card_dictation_desc: "\u8fdb\u5165\u5355\u8bcd\u542c\u5199\u9875\u9762\uff0c\u5feb\u901f\u5f00\u59cb\u7ec3\u4e60\u4e0e\u8bb0\u5fc6\u3002",
                card_tools_title: "\u5de5\u5177",
                card_tools_desc: "\u6253\u5f00\u5de5\u5177\u7bb1\u9996\u9875\uff0c\u6d4f\u89c8\u548c\u8fdb\u5165\u5404\u4e2a\u5e38\u7528\u9879\u76ee\u3002",
                card_ai_title: "AI \u5bfc\u822a",
                card_ai_desc: "\u96c6\u4e2d\u6d4f\u89c8\u5e38\u7528 AI \u4ea7\u54c1\uff0c\u6309\u573a\u666f\u5feb\u901f\u7b5b\u9009\u548c\u76f4\u8fbe\u3002"
            },
            en: {
                lang: "en",
                description: "A minimal portal home for dictation, tools, and AI navigation.",
                ogLocale: "en_US",
                nav_dictation: "Dictation",
                nav_tools: "Tools",
                nav_ai: "AI Nav",
                cta_dictation: "Dictation",
                cta_tools: "Tools",
                cta_ai: "AI",
                card_dictation_title: "Dictation",
                card_dictation_desc: "Open the dictation page and start practicing words right away.",
                card_tools_title: "Tools",
                card_tools_desc: "Browse the toolbox homepage and jump into useful project pages.",
                card_ai_title: "AI Navigation",
                card_ai_desc: "Browse common AI products and filter them by scenario with one click."
            }
        };

        const HOME_STORAGE_KEY = "portal-lang";
        const metaDescription = document.querySelector('meta[name="description"]');
        const ogDescription = document.querySelector('meta[property="og:description"]');
        const twitterDescription = document.querySelector('meta[name="twitter:description"]');
        const ogLocale = document.querySelector('meta[property="og:locale"]');

        function applyHomeLocale(locale) {
            const copy = HOME_I18N[locale] || HOME_I18N.zh;
            document.documentElement.lang = copy.lang;
            metaDescription.setAttribute("content", copy.description);
            ogDescription.setAttribute("content", copy.description);
            twitterDescription.setAttribute("content", copy.description);
            ogLocale.setAttribute("content", copy.ogLocale);

            document.querySelectorAll("[data-i18n]").forEach((node) => {
                const key = node.getAttribute("data-i18n");
                node.textContent = copy[key] || "";
            });

            document.querySelectorAll("[data-lang]").forEach((button) => {
                button.classList.toggle("active", button.getAttribute("data-lang") === locale);
            });

            localStorage.setItem(HOME_STORAGE_KEY, locale);
        }

        const initialLocale = localStorage.getItem(HOME_STORAGE_KEY) || "zh";
        applyHomeLocale(initialLocale);

        document.querySelectorAll("[data-lang]").forEach((button) => {
            button.addEventListener("click", () => applyHomeLocale(button.getAttribute("data-lang")));
        });
    </script>
</body>
</html>
