    const el = {
      list: document.getElementById("project-list"),
      hero: document.getElementById("detail-hero"),
      type: document.getElementById("detail-type"),
      title: document.getElementById("detail-title"),
      copy: document.getElementById("detail-copy"),
      open: document.getElementById("detail-open"),
      secondary: document.getElementById("detail-secondary"),
      features: document.getElementById("feature-list"),
      meta: document.getElementById("meta-grid"),
      quick: document.getElementById("quick-links")
    };

    const state = { activeId: "tools", lang: "zh" };

    function t(key) {
      return copy[key]?.[state.lang] ?? "";
    }

    function getProject(id) {
      return projects.find((item) => item.id === id) || projects[0];
    }

    function renderList() {
      el.list.innerHTML = "";
      projects.forEach((project) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "project-item" + (project.id === state.activeId ? " active" : "");
        button.style.setProperty("--item-accent", project.color);
        button.style.setProperty("--item-soft", project.soft);
        button.innerHTML = `
          <span class="project-type">${project.type[state.lang]}</span>
          <div class="project-name">${project.name[state.lang]}</div>
          <p class="project-desc">${project.short[state.lang]}</p>
        `;
        button.addEventListener("click", () => {
          state.activeId = project.id;
          render();
        });
        el.list.appendChild(button);
      });
    }

    function metaCard(label, value) {
      return `<div class="meta-card"><div class="meta-label">${label}</div><div class="meta-value">${value}</div></div>`;
    }

    function renderDetail() {
      const project = getProject(state.activeId);
      el.hero.style.setProperty("--hero-accent", project.color);
      el.type.textContent = project.type[state.lang];
      el.title.textContent = project.name[state.lang];
      el.copy.textContent = project.long[state.lang];
      el.open.href = project.path;
      el.open.textContent = t("openNow");
      el.secondary.href = project.path;
      el.secondary.textContent = t("openInPlace");

      el.features.innerHTML = project.features[state.lang].map((item) => `
        <div class="feature">
          <span class="feature-dot"></span>
          <span>${item}</span>
        </div>
      `).join("");

      el.meta.innerHTML = [
        metaCard(t("metaType"), project.type[state.lang]),
        metaCard(t("metaPath"), project.path),
        metaCard(t("metaStyle"), project.style[state.lang]),
        metaCard(t("metaUpdate"), project.update[state.lang])
      ].join("");

      const quickTitles = [t("quickTitle1"), t("quickTitle2"), t("quickTitle3")];
      el.quick.innerHTML = project.quick[state.lang].map((item, index) => `
        <div class="quick-link" style="--hero-accent:${project.color}">
          <strong>${quickTitles[index]}</strong>
          <span>${item}</span>
        </div>
      `).join("");
    }

    function render() {
      window.SiteI18n.applyMessages(copy, state.lang);
      renderList();
      renderDetail();
    }

    state.lang = window.SiteI18n.getLang();
    window.SiteI18n.bindPage(copy, (lang) => {
      state.lang = lang;
      render();
    });
  </script>
