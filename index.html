    const state = {
      lang: "zh",
      category: "all",
      mode: "all",
      search: ""
    };

    const navEl = document.getElementById("sidebar-nav");
    const shortcutEl = document.getElementById("shortcut-row");
    const gridEl = document.getElementById("resource-grid");
    const emptyEl = document.getElementById("empty-state");
    const searchEl = document.getElementById("search-input");
    const langButtons = [...document.querySelectorAll("[data-lang]")];
    const modeButtons = [...document.querySelectorAll("[data-filter]")];

    function categoryLabel(id) {
      return categories.find((item) => item.id === id)?.label[state.lang] || "";
    }

    function applyMessages() {
      window.SiteI18n.applyMessages(messages, state.lang);
      searchEl.placeholder = state.lang === "zh"
        ? "搜索你想要的网站、站内入口或工具..."
        : "Search for tools, internal pages, or websites...";

      modeButtons.forEach((button) => {
        const key = button.dataset.filter;
        button.textContent = filters[key][state.lang];
      });
    }

    function renderLang() {
      langButtons.forEach((button) => {
        button.classList.toggle("active", button.dataset.lang === state.lang);
      });
    }

    function renderSidebar() {
      navEl.innerHTML = categories.map((item) => `
        <button class="nav-btn ${item.id === state.category ? "active" : ""}" type="button" data-category="${item.id}">
          <span class="nav-icon">${item.icon}</span>
          <span>${item.label[state.lang]}</span>
        </button>
      `).join("");
    }

    function renderShortcuts() {
      shortcutEl.innerHTML = categories.slice(1).map((item) => `
        <button class="shortcut ${item.id === state.category ? "active" : ""}" type="button" data-category="${item.id}">
          <span class="shortcut-icon">${item.icon}</span>
          <span>${item.label[state.lang]}</span>
        </button>
      `).join("");
    }

    function filteredResources() {
      const query = state.search.trim().toLowerCase();
      return resources.filter((item) => {
        const categoryPass = state.category === "all" || item.category === state.category;
        const modePass = state.mode === "all" || item.mode === state.mode;
        const haystack = [
          item.name,
          item.subtitle.zh,
          item.subtitle.en,
          item.summary.zh,
          item.summary.en,
          ...item.tags.zh,
          ...item.tags.en
        ].join(" ").toLowerCase();
        const searchPass = !query || haystack.includes(query);
        return categoryPass && modePass && searchPass;
      });
    }

    function renderGrid() {
      const items = filteredResources();
      emptyEl.hidden = items.length > 0;
      gridEl.innerHTML = items.map((item) => `
        <article class="card">
          <div class="card-top">
            <div class="card-brand">
              <div class="card-icon">${item.icon}</div>
              <div>
                <h3>${item.name}</h3>
                <div class="card-kicker">${item.subtitle[state.lang]}</div>
              </div>
            </div>
            <span class="badge">${item.badge[state.lang]}</span>
          </div>
          <p>${item.summary[state.lang]}</p>
          <div class="tag-row">
            ${item.tags[state.lang].slice(0, 3).map((tag) => `<span class="chip">${tag}</span>`).join("")}
          </div>
          <div class="card-bottom">
            <span class="host">${item.host}</span>
            <a class="visit" href="${item.url}" target="${item.mode === "external" ? "_blank" : "_self"}" rel="noreferrer">${state.lang === "zh" ? "打开" : "Open"}</a>
          </div>
        </article>
      `).join("");
    }

    function renderModes() {
      modeButtons.forEach((button) => {
        button.classList.toggle("active", button.dataset.filter === state.mode);
      });
    }

    function bindInteractions() {
      navEl.addEventListener("click", (event) => {
        const button = event.target.closest("[data-category]");
        if (!button) return;
        state.category = button.dataset.category;
        render();
      });

      shortcutEl.addEventListener("click", (event) => {
        const button = event.target.closest("[data-category]");
        if (!button) return;
        state.category = button.dataset.category;
        render();
      });

      modeButtons.forEach((button) => {
        button.addEventListener("click", () => {
          state.mode = button.dataset.filter;
          render();
        });
      });

      langButtons.forEach((button) => {
        button.addEventListener("click", () => {
          state.lang = button.dataset.lang;
          window.SiteI18n.setLang(state.lang);
          render();
        });
      });

      searchEl.addEventListener("input", (event) => {
        state.search = event.target.value;
        renderGrid();
      });

      window.addEventListener("keydown", (event) => {
        if (event.key.toLowerCase() === "k" && !event.metaKey && !event.ctrlKey && document.activeElement !== searchEl) {
          event.preventDefault();
          searchEl.focus();
        }
      });
    }

    function render() {
      applyMessages();
      renderLang();
      renderSidebar();
      renderShortcuts();
      renderModes();
      renderGrid();
    }

    state.lang = window.SiteI18n.getLang();
    window.SiteI18n.bindPage(messages, (lang) => {
      state.lang = lang;
      render();
    });

    bindInteractions();
    render();
  </script>
