<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kindle 取书 | 88220066.xyz</title>
  <meta name="description" content="在 Kindle 上输入 4 位数字取书码，直接下载书。">
  <meta name="theme-color" content="#f5f7ff">
  <script src="../notes/site-i18n.js"></script>
  <link rel="stylesheet" href="../notes/page-sync.css">
<script defer src="../notes/project-nav.js"></script>
  <style>
    :root{--bg:#f8f6f2;--panel:#ffffff;--line:rgba(120,98,73,.14);--text:#221b14;--muted:#7a6a59;--accent:#c58e5b;--accent-soft:#fbf2e9;--max:760px}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",sans-serif}
    a{color:inherit;text-decoration:none}
    .shell{width:min(calc(100% - 28px),var(--max));margin:0 auto;padding:24px 0 40px}
    .nav,.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px}
    .nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px}
    .brand{font-weight:700}
    .links{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.95rem}
    .hero{margin-top:16px;padding:24px}
    .hero h1{margin:0;font-size:clamp(2rem,5vw,2.8rem);letter-spacing:-.05em}
    .hero p{margin:10px 0 0;color:var(--muted);line-height:1.8}
    .pill{display:inline-flex;align-items:center;min-height:38px;padding:0 14px;border-radius:999px;background:var(--accent-soft);border:1px solid rgba(197,142,91,.22);color:#8b6037;font-size:.92rem}
    .hero-row{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
    .panel{margin-top:16px;padding:22px}
    .panel h2{margin:0 0 12px;font-size:1.18rem}
    .pickup-form{display:grid;gap:12px}
    .pickup-input{width:100%;padding:16px 18px;border-radius:18px;border:1px solid var(--line);background:#fff;color:var(--text);font-size:1.2rem;text-align:center;letter-spacing:.28em}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 18px;border-radius:999px;border:1px solid rgba(197,142,91,.24);background:#f9ecdf;color:#8a6238;font-weight:600;cursor:pointer}
    .meta{display:grid;gap:10px;color:var(--muted);line-height:1.7}
    .tips{margin:0;padding-left:18px;color:var(--muted);line-height:1.8}
    .foot{margin-top:16px;color:var(--muted);font-size:.94rem;text-align:center}
  </style>
  <link rel="stylesheet" href="../notes/light-app-theme.css">
</head>
<body data-i18n-title="pageTitle" data-i18n-description="pageDescription">
  <div class="shell">
    <header class="nav">
      <div class="brand" data-i18n="brand">88220066.xyz / Kindle 取书</div>
      <nav class="links">
        <a href="/">首页</a>
        <a href="../skills-nav/index.html">技能</a>
      </nav>
    </header>

    <section class="panel hero">
      <div class="hero-row">
        <div>
          <h1 data-i18n="heroTitle">Kindle 取书</h1>
          <p data-i18n="heroCopy">这里只负责输码取书。输入 4 位数字取书码，确认后就能看到下载按钮。</p>
        </div>
        <div class="pill" data-i18n="heroPill">10 分钟后自动删除</div>
      </div>
    </section>

    <section class="panel">
      <h2 data-i18n="formTitle">输入取书码</h2>
      <form class="pickup-form" action="/api/kindle-share/pickup-page" method="get">
        <input class="pickup-input" type="text" name="code" maxlength="4" inputmode="numeric" pattern="[0-9]{4}" placeholder="4 位数字" data-i18n-placeholder="codePlaceholder" autocomplete="off" required>
        <button class="btn" type="submit" data-i18n="submitBtn">查看这本书</button>
      </form>
    </section>

    <section class="panel">
      <h2 data-i18n="tipsTitle">说明</h2>
      <ul class="tips">
        <li data-i18n="tip1">电脑上传后会拿到 4 位数字码。</li>
        <li data-i18n="tip2">书在网站里只做临时中转，不会长期保留。</li>
        <li data-i18n="tip3">下载成功后会立刻删除，没人取的话 10 分钟后也会自动删掉。</li>
      </ul>
    </section>

  </div>
  <script>
    const pageCopy = {
      pageTitle: { zh: "Kindle 取书 | 88220066.xyz", en: "Kindle Pickup | 88220066.xyz" },
      pageDescription: { zh: "在 Kindle 上输入 4 位数字取书码，直接下载书。", en: "Enter a 4-digit pickup code on Kindle and download the book directly." },
      brand: { zh: "88220066.xyz / Kindle 取书", en: "88220066.xyz / Kindle Pickup" },
      heroTitle: { zh: "Kindle 取书", en: "Kindle Pickup" },
      heroCopy: { zh: "这里只负责输码取书。输入 4 位数字取书码，确认后就能看到下载按钮。", en: "This page is only for pickup. Enter the 4-digit code and you will get the download button." },
      heroPill: { zh: "10 分钟后自动删除", en: "Auto-delete in 10 min" },
      formTitle: { zh: "输入取书码", en: "Enter Pickup Code" },
      codePlaceholder: { zh: "4 位数字", en: "4 digits" },
      submitBtn: { zh: "查看这本书", en: "Open This Book" },
      tipsTitle: { zh: "说明", en: "Notes" },
      tip1: { zh: "电脑上传后会拿到 4 位数字码。", en: "After uploading on desktop, you will get a 4-digit code." },
      tip2: { zh: "书在网站里只做临时中转，不会长期保留。", en: "Books are only stored temporarily and are not kept long term." },
      tip3: { zh: "下载成功后会立刻删除，没人取的话 10 分钟后也会自动删掉。", en: "The file is deleted after a successful download, or automatically after 10 minutes if nobody picks it up." }
    };
    window.SiteI18n.bindPage(pageCopy);
  </script>
</body>
</html>
