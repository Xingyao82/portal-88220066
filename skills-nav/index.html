<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <style>
    :root{--bg:#f8f6f2;--panel:#ffffff;--line:rgba(120,98,73,.14);--text:#221b14;--muted:#7a6a59;--accent:#c58e5b;--accent-soft:#fbf2e9;--max:1060px}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",sans-serif}
    a{color:inherit;text-decoration:none}
    .shell{width:min(calc(100% - 28px),var(--max));margin:0 auto;padding:24px 0 40px}
    .nav,.hero,.section,.card{background:var(--panel);border:1px solid var(--line);border-radius:22px}
    .nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px}
    .brand{font-weight:700}
    .links{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.95rem}
    .hero{margin-top:16px;padding:24px}
    .hero h1{margin:0;font-size:clamp(2rem,5vw,2.8rem);letter-spacing:-.05em}
    .hero p{margin:10px 0 0;color:var(--muted);line-height:1.8}
    .section{margin-top:16px;padding:20px}
    .section h2{margin:0 0 14px;font-size:1.2rem}
    .card{padding:20px}
    .head{display:flex;align-items:center;gap:12px}
    .logo{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:14px;background:var(--accent-soft);color:#8a6238;font-weight:700}
    .meta{color:var(--muted);font-size:.92rem}
    .card p{margin:14px 0 0;color:var(--muted);line-height:1.8}
    .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
    .chip{display:inline-flex;padding:7px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--muted);background:#fff}
    .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
    .btn,.ghost{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:999px;font-weight:600}
    .btn{background:#f9ecdf;border:1px solid rgba(197,142,91,.24);color:#8a6238}
    .ghost{background:#fff;border:1px solid var(--line);color:var(--muted)}
    .steps{margin:14px 0 0;padding-left:18px;color:var(--muted);line-height:1.8}
  </style>
</head>
<body>
  <div class="shell">
    <header class="nav">

          <li>电脑打开上传页，传一本书。</li>

</body>
</html>
