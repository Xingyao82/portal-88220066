    function filteredProviders(lang){return providers.filter((item)=>{const haystack=[item.name,item.summary[lang],options.region[item.region][lang],options.compat[item.compat][lang],options.free[item.free][lang],options.card[item.card][lang],...item.tags[lang]].join(" ").toLowerCase(); return (state.region==="all"||item.region===state.region)&&(state.compat==="all"||item.compat===state.compat)&&(state.free==="all"||item.free===state.free)&&(state.card==="all"||item.card===state.card)&&(!state.search||haystack.includes(state.search));});}
    function hostLabel(url){ try { const parsed=new URL(url); return `${parsed.host}${parsed.pathname === "/" ? "" : parsed.pathname}`; } catch { return url; } }
    function cardTemplate(item,lang){return `<article class="tool-card" style="--tool-accent:${item.accent}"><div class="tool-top"><div><div class="meta">${options.region[item.region][lang]} / ${options.compat[item.compat][lang]}</div><h3>${item.name}</h3></div><div><span class="status-badge">${options.free[item.free][lang]}</span></div></div><p>${item.summary[lang]}</p><div class="tag-row">${item.tags[lang].map((tag)=>`<span class="chip">${tag}</span>`).join("")}<span class="chip">${options.card[item.card][lang]}</span></div><div class="mini-list"><div><span>${lang==="zh"?"免费方式":"Free Model"}</span><strong>${options.free[item.free][lang]}</strong></div><div><span>${lang==="zh"?"绑卡要求":"Card"}</span><strong>${options.card[item.card][lang]}</strong></div></div><div class="card-bottom"><span class="meta">${hostLabel(item.url)}</span><div class="btn-row"><a class="ghost" href="${item.docs}" target="_blank" rel="noreferrer">${labels[lang].docs}</a><a class="visit" href="${item.url}" target="_blank" rel="noreferrer">${labels[lang].open}</a></div></div></article>`;}
    function renderStats(lang){brandEl.textContent=labels[lang].brand; searchEl.placeholder=labels[lang].searchPlaceholder; statsEl.innerHTML=labels[lang].stats.map(([label,value])=>`<div class="stat"><div class="stat-label">${label}</div><strong>${value}</strong></div>`).join("");}
    function renderPage(lang){renderStats(lang); renderChipGroup(regionEl,["all",...Object.keys(options.region)],"Region",state.region,lang); renderChipGroup(compatEl,["all",...Object.keys(options.compat)],"Compat",state.compat,lang); renderChipGroup(freeEl,["all",...Object.keys(options.free)],"Free",state.free,lang); renderChipGroup(cardEl,["all",...Object.keys(options.card)],"Card",state.card,lang); quickGridEl.innerHTML=providers.filter((item)=>quickNames.has(item.name)).map((item)=>cardTemplate(item,lang)).join(""); const items=filteredProviders(lang); countEl.textContent=`${labels[lang].showing} ${items.length} / ${providers.length} ${labels[lang].items}`; gridEl.innerHTML=items.length?items.map((item)=>cardTemplate(item,lang)).join(""):`<div class="empty">${labels[lang].noMatch}</div>`;}
    document.body.addEventListener("click",(event)=>{const button=event.target.closest("[data-group]"); if(!button)return; state[button.dataset.group.toLowerCase()]=button.dataset.value; renderPage(window.SiteI18n.getLang());});
    searchEl.addEventListener("input",()=>{state.search=searchEl.value.trim().toLowerCase(); renderPage(window.SiteI18n.getLang());});
    window.SiteI18n.bindPage(pageCopy,renderPage);
  </script>
<script id="claw-grid-script">
(function(){
  const hideBlock = (selector) => {
    const el = document.querySelector(selector);
    if (!el) return;
    const section = el.closest('.section') || el.closest('.stats');
    if (section) section.style.display = 'none';
    else el.style.display = 'none';
  };
  ['#stats','#quick-grid','#featured-grid','.hero-actions'].forEach(hideBlock);

  const initials = (text) => {
    const clean = (text || '').replace(/\s+/g,' ').trim();
    if (!clean) return 'AI';
    if (/^[A-Za-z0-9]/.test(clean)) {
      const parts = clean.split(/[^A-Za-z0-9]+/).filter(Boolean);
      return (parts[0] || clean).slice(0,2).toUpperCase();
    }
    return clean.slice(0,2);
  };

  const logoUrls = (href) => {
    try {
      const parsed = new URL(href, window.location.href);
      if (!/^https?:$/.test(parsed.protocol)) return [];
      return [
        parsed.origin + '/favicon.ico',
        'https://www.google.com/s2/favicons?sz=128&domain_url=' + encodeURIComponent(parsed.href)
      ];
    } catch {
      return [];
    }
  };

  const attachLogoImage = (container, href, label) => {
    const urls = logoUrls(href);
    if (!urls.length) return;
    const img = document.createElement('img');
    img.alt = label + ' logo';
    img.loading = 'lazy';
    img.decoding = 'async';
    img.referrerPolicy = 'no-referrer';
    let index = 0;
    const next = () => {
      if (index >= urls.length) {
        container.classList.remove('has-image');
        img.remove();
        return;
      }
      img.src = urls[index++];
    };
    img.addEventListener('load', () => container.classList.add('has-image'));
    img.addEventListener('error', next);
    container.appendChild(img);
    next();
  };

  const enhanceCard = (card) => {
    if (card.querySelector('.mini-logo')) return;
    const top = card.querySelector('.tool-top') || card.querySelector('.card-top');
    if (!top) return;
    const info = top.firstElementChild;
    if (!info) return;
    const title = info.querySelector('h3,.model,h4');
    if (!title) return;
    const wrap = document.createElement('div');
    wrap.className = 'compact-head';
    const logo = document.createElement('span');
    logo.className = 'mini-logo';
    const fallback = document.createElement('span');
    fallback.className = 'mini-logo-fallback';
    fallback.textContent = initials(title.textContent);
    logo.appendChild(fallback);
    const link = card.querySelector('.visit[href]') || card.querySelector('.ghost[href], a[href^="http"]');
    if (link) attachLogoImage(logo, link.href, title.textContent.trim());
    const copy = document.createElement('div');
    copy.className = 'compact-copy';
    while (info.firstChild) {
      copy.appendChild(info.firstChild);
    }
    wrap.appendChild(logo);
    wrap.appendChild(copy);
    info.appendChild(wrap);
  };

  const enhanceAllCards = () => {
    document.querySelectorAll('.tool-card,.quick-card,.card').forEach(enhanceCard);
  };

  let scheduled = false;
  const scheduleEnhance = () => {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(() => {
      scheduled = false;
      enhanceAllCards();
    });
  };

  new MutationObserver(scheduleEnhance).observe(document.body, { childList: true, subtree: true });
  scheduleEnhance();
})();
</script></body>
</html>
