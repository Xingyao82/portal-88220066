    let latestMeta = null;

    const regionChipsEl = document.getElementById("region-chips");
    const compatChipsEl = document.getElementById("compat-chips");
    const freeChipsEl = document.getElementById("free-chips");
    const cardChipsEl = document.getElementById("card-chips");
    const scoreChipsEl = document.getElementById("score-chips");
    const quickGridEl = document.getElementById("quick-grid");
    const gridEl = document.getElementById("grid");
    const countEl = document.getElementById("count");
    const searchEl = document.getElementById("search-input");
    const sourceNoteEl = document.getElementById("source-note");
    const statSourceEl = document.getElementById("stat-source");
    const statUpdatedEl = document.getElementById("stat-updated");
    const statStorageEl = document.getElementById("stat-storage");
    const statNoteEl = document.getElementById("stat-note");

    function scoreLabel(score) {
      if (score >= 5) return labels.score_high;
      if (score >= 4) return labels.score_mid;
      return labels.score_low;
    }

    function formatTime(value) {
      if (!value) return "\u672a\u540c\u6b65";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toLocaleString("zh-CN", { hour12: false });
    }

    function hostFromUrl(url) {
      try {
        return new URL(url).host.replace(/^www\./, "");
      } catch {
        return url || "-";
      }
    }

    function normalizeProvider(provider) {
      const extra = enrichments[provider.name] || {};
      const tags = Array.isArray(provider.tags) ? provider.tags.slice() : [];
      const merged = {
        ...provider,
        ...extra,
        card: extra.card || provider.card || "card_unknown",
        score: extra.score || provider.score || 3,
        docs: extra.docs || provider.docs || provider.url,
        recommended: Boolean(extra.recommended || provider.recommended),
        tags,
      };
      if (labels[merged.region] === "\u56fd\u5185" && !merged.tags.includes("\u56fd\u5185")) merged.tags.unshift("\u56fd\u5185");
      if (merged.card === "card_no" && !merged.tags.includes("\u514d\u7ed1\u5361")) merged.tags.push("\u514d\u7ed1\u5361");
      if (merged.card === "card_maybe" && !merged.tags.includes("\u53ef\u80fd\u7ed1\u5361")) merged.tags.push("\u53ef\u80fd\u7ed1\u5361");
      if (labels[merged.compat] && !merged.tags.includes(labels[merged.compat])) merged.tags.push(labels[merged.compat]);
      return merged;
    }

    function mergeBuiltinProviders(items) {
      const existing = new Set(items.map((item) => item.name));
      const merged = items.slice();
      builtinProviders.forEach((provider) => {
        if (!existing.has(provider.name)) merged.push(provider);
      });
      return merged;
    }

    function renderChipGroup(container, values, key, current) {
      container.innerHTML = values.map((value) => `
        <button class="chip-btn ${value === current ? "active" : ""}" data-${key}="${value}" type="button">${value}</button>
      `).join("");
    }

    function renderChips() {
      renderChipGroup(regionChipsEl, regions, "region", state.region);
      renderChipGroup(compatChipsEl, compats, "compat", state.compat);
      renderChipGroup(freeChipsEl, freeTypes, "free-type", state.freeType);
      renderChipGroup(cardChipsEl, cards, "card", state.card);
      renderChipGroup(scoreChipsEl, scores, "score", state.score);
    }

    function matchesScore(score) {
      if (state.score === labels.allScore) return true;
      if (state.score === labels.score_high) return score >= 5;
      if (state.score === labels.score_mid) return score >= 4 && score < 5;
      return score < 4;
    }

    function filteredProviders() {
      return providers.filter((provider) => {
        const regionLabel = labels[provider.region];
        const compatLabel = labels[provider.compat];
        const freeLabel = labels[provider.freeType];
        const cardLabel = labels[provider.card];
        const haystack = [
          provider.name,
          provider.summary,
          provider.note,
          regionLabel,
          compatLabel,
          freeLabel,
          cardLabel,
          scoreLabel(provider.score),
          ...(provider.tags || [])
        ].join(" ").toLowerCase();

        const matchRegion = state.region === labels.allRegions || regionLabel === state.region;
        const matchCompat = state.compat === labels.allCompat || compatLabel === state.compat;
        const matchFree = state.freeType === labels.allFree || freeLabel === state.freeType;
        const matchCard = state.card === labels.allCard || cardLabel === state.card;
        const matchSearch = !state.search || haystack.includes(state.search);

        return matchRegion && matchCompat && matchFree && matchCard && matchesScore(provider.score) && matchSearch;
      });
    }

    function cardTemplate(provider) {
      return `
        <article class="tool-card" style="--tool-accent:${provider.accent || "#4b8dff"}">
          <div class="tool-top">
            <div>
              <div class="meta">${labels[provider.region] || provider.region} / ${labels[provider.compat] || provider.compat}</div>
              <h3>${provider.name}</h3>
            </div>
            <div class="btn-row">
              <span class="score-badge">\u63a8\u8350 ${provider.score}/5</span>
              <span class="badge">${provider.badge || "\u5e38\u7528"}</span>
            </div>
          </div>
          <p>${provider.summary || provider.note || "\u6682\u65e0\u8bf4\u660e"}</p>
          <div class="tag-row">
            ${(provider.tags || []).slice(0, 5).map((tag) => `<span class="chip">${tag}</span>`).join("")}
          </div>
          <div class="mini-list">
            <div><span>\u514d\u8d39\u65b9\u5f0f</span><strong>${labels[provider.freeType] || provider.freeType}</strong></div>
            <div><span>\u7ed1\u5361\u8981\u6c42</span><strong>${labels[provider.card] || labels.card_unknown}</strong></div>
            <div><span>\u63a5\u5165\u63d0\u793a</span><strong>${provider.note || "\u67e5\u770b\u5b98\u65b9\u6587\u6863"}</strong></div>
          </div>
          <div class="card-bottom">
            <span class="meta">${hostFromUrl(provider.url)}</span>
            <div class="btn-row">
              <a class="ghost" href="${provider.docs || provider.url}" target="_blank" rel="noreferrer">${labels.docs}</a>
              <a class="visit" href="${provider.url}" target="_blank" rel="noreferrer">${labels.open}</a>
            </div>
          </div>
        </article>
      `;
    }

    function renderQuickGrid(items) {
      const quick = items
        .filter((item) => item.recommended || item.score >= 5)
        .sort((a, b) => b.score - a.score || a.name.localeCompare(b.name))
        .slice(0, 6);

      quickGridEl.innerHTML = quick.map(cardTemplate).join("");
    }

    function renderGrid() {
      const items = filteredProviders();
      countEl.textContent = `${labels.showing} ${items.length} / ${providers.length} ${labels.items}`;
      renderQuickGrid(providers);

      if (!items.length) {
        gridEl.innerHTML = `<div class="empty">${labels.noMatch}</div>`;
        return;
      }

      gridEl.innerHTML = items
        .sort((a, b) => b.score - a.score || a.name.localeCompare(b.name))
        .map(cardTemplate)
        .join("");
    }

    function bindChipEvents() {
      regionChipsEl.addEventListener("click", (event) => {
        const button = event.target.closest("[data-region]");
        if (!button) return;
        state.region = button.dataset.region;
        renderChips();
        renderGrid();
      });

      compatChipsEl.addEventListener("click", (event) => {
        const button = event.target.closest("[data-compat]");
        if (!button) return;
        state.compat = button.dataset.compat;
        renderChips();
        renderGrid();
      });

      freeChipsEl.addEventListener("click", (event) => {
        const button = event.target.closest("[data-free-type]");
        if (!button) return;
        state.freeType = button.dataset.freeType;
        renderChips();
        renderGrid();
      });

      cardChipsEl.addEventListener("click", (event) => {
        const button = event.target.closest("[data-card]");
        if (!button) return;
        state.card = button.dataset.card;
        renderChips();
        renderGrid();
      });

      scoreChipsEl.addEventListener("click", (event) => {
        const button = event.target.closest("[data-score]");
        if (!button) return;
        state.score = button.dataset.score;
        renderChips();
        renderGrid();
      });

      searchEl.addEventListener("input", () => {
        state.search = searchEl.value.trim().toLowerCase();
        renderGrid();
      });
    }

    async function loadHealth() {
      try {
        const response = await fetch("/api/free-models/health", { headers: { Accept: "application/json" } });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const health = await response.json();
        statSourceEl.textContent = "Cloudflare Worker + KV";
        statUpdatedEl.textContent = formatTime(health.lastSyncedAt || health.updatedAt);
        statStorageEl.textContent = health.storage === "kv" ? "KV \u5df2\u751f\u6548" : "\u5df2\u56de\u9000\u5230\u5185\u7f6e";
        statNoteEl.textContent = health.kvConfigured ? "\u5b9a\u65f6\u4efb\u52a1\u4f1a\u628a\u6574\u7406\u540e\u7684\u6570\u636e\u5199\u5165 KV" : "\u5f53\u524d\u4ecd\u5728\u4f7f\u7528\u5185\u7f6e\u6570\u636e";
      } catch (error) {
        statSourceEl.textContent = "\u9875\u9762\u5185\u7f6e\u6570\u636e";
        statUpdatedEl.textContent = "\u672a\u83b7\u53d6\u5230";
        statStorageEl.textContent = "\u63a5\u53e3\u5f02\u5e38";
        statNoteEl.textContent = "Worker \u6682\u65f6\u4e0d\u53ef\u7528\u65f6\uff0c\u9875\u9762\u4ecd\u80fd\u6b63\u5e38\u6253\u5f00";
      }
    }

    async function loadProviders() {
      try {
        const response = await fetch("/api/free-models", { headers: { Accept: "application/json" } });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        if (!Array.isArray(data.items) || !data.items.length) throw new Error("Empty items");
        latestMeta = data;
        providers = mergeBuiltinProviders(data.items).map(normalizeProvider);
        sourceNoteEl.textContent = `\u5f53\u524d\u6570\u636e\u6765\u6e90\uff1aCloudflare Worker \u63a5\u53e3\uff0c\u6700\u8fd1\u540c\u6b65\u65f6\u95f4 ${formatTime(data.lastSyncedAt || data.updatedAt)}\u3002\u9875\u9762\u91cc\u8fd8\u8865\u4e86\u6587\u6863\u3001\u7ed1\u5361\u8981\u6c42\u548c\u63a8\u8350\u7b49\u7ea7\uff0c\u65b9\u4fbf\u76f4\u63a5\u7b5b\u3002`;
      } catch (error) {
        latestMeta = null;
        providers = mergeBuiltinProviders(fallbackProviders).map(normalizeProvider);
        sourceNoteEl.textContent = "\u5f53\u524d\u672a\u80fd\u8bfb\u5230 Worker \u6570\u636e\uff0c\u9875\u9762\u5df2\u81ea\u52a8\u5207\u5230\u5185\u7f6e\u5907\u7528\u5217\u8868\u3002\u7ad9\u70b9\u80fd\u7ee7\u7eed\u7528\uff0c\u4f46\u540c\u6b65\u65f6\u95f4\u548c\u5b58\u50a8\u72b6\u6001\u4f1a\u5931\u771f\u3002";
      }

      renderChips();
      renderGrid();
    }

    bindChipEvents();
    loadHealth();
    loadProviders();
  </script>
</body>
</html>
