      openBadge: { zh: "\u5F00\u6E90", en: "Open" },
      closedBadge: { zh: "\u95ED\u6E90", en: "Closed" },
      openLink: { zh: "\u6253\u5F00", en: "Open" },
      noLicense: { zh: "\u672A\u6807\u6CE8\u8BB8\u53EF", en: "License not listed" },
      noOrg: { zh: "\u672A\u77E5\u673A\u6784", en: "Unknown org" }
    };

    const state = {
      lang: "zh",
      source: "all",
      availability: "all",
      search: "",
      payload: null
    };

    const sourceOptions = ["all", "lmarena", "open-llm"];
    const availabilityOptions = ["all", "open", "closed"];

    const elements = {
      stats: document.getElementById("stats"),
      sections: document.getElementById("sections"),
      sourceChips: document.getElementById("sourceChips"),
      availabilityChips: document.getElementById("availabilityChips"),
      search: document.getElementById("search"),
      heroUpdated: document.getElementById("heroUpdated"),
      statTemplate: document.getElementById("stat-template"),
      sectionTemplate: document.getElementById("section-template"),
      cardTemplate: document.getElementById("card-template")
    };

    function t(key, fallback) {
      return copy[key]?.[state.lang] ?? fallback ?? key;
    }

    function formatCount(count) {
      return t("sectionCount").replace("{count}", String(count));
    }

    function matchesSearch(item) {
      if (!state.search) return true;
      const haystack = [
        item.model,
        item.organization,
        item.license,
        item.note,
        item.sourceName,
        item.sourceNameEn
      ].join(" ").toLowerCase();
      return haystack.includes(state.search);
    }

    function filterItems(items) {
      return items.filter((item) => {
        if (state.source !== "all" && item.source !== state.source) return false;
        if (state.availability !== "all" && item.availability !== state.availability) return false;
        return matchesSearch(item);
      });
    }

    function buildChip(label, active, onClick) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "chip" + (active ? " active" : "");
      button.textContent = label;
      button.addEventListener("click", onClick);
      return button;
    }

    function renderChips() {
      elements.sourceChips.innerHTML = "";
      elements.availabilityChips.innerHTML = "";

      sourceOptions.forEach((value) => {
        const key = value === "all" ? "chipAllSources" : value === "lmarena" ? "chipArena" : "chipOpenLlm";
        elements.sourceChips.appendChild(buildChip(t(key), state.source === value, () => {
          state.source = value;
          render();
        }));
      });

      availabilityOptions.forEach((value) => {
        const key = value === "all" ? "chipAllAvailability" : value === "open" ? "chipOpen" : "chipClosed";
        elements.availabilityChips.appendChild(buildChip(t(key), state.availability === value, () => {
          state.availability = value;
          render();
        }));
      });
    }

    function renderStats(items) {
      const openCount = items.filter((item) => item.availability === "open").length;
      const closedCount = items.filter((item) => item.availability === "closed").length;
      const sources = new Set(items.map((item) => item.source)).size;
      const rows = [
        [t("statsUpdated"), state.payload.updatedText || "-"],
        [t("statsModels"), String(items.length)],
        [t("statsOpen"), String(openCount)],
        [t("statsClosed"), String(closedCount)],
        [t("statsSources"), String(sources)]
      ];

      elements.stats.innerHTML = "";
      rows.forEach(([label, value]) => {
        const node = elements.statTemplate.content.firstElementChild.cloneNode(true);
        node.querySelector("span").textContent = label;
        node.querySelector("strong").textContent = value;
        elements.stats.appendChild(node);
      });
      elements.heroUpdated.textContent = state.payload.updatedText ? `${t("statsUpdated")}: ${state.payload.updatedText}` : t("statsUpdated");
    }

    function makeTag(text) {
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = text;
      return tag;
    }

    function renderCard(item) {
      const card = elements.cardTemplate.content.firstElementChild.cloneNode(true);
      card.classList.add(item.availability === "open" ? "open" : "closed");
      card.querySelector(".rank").textContent = `#${item.rank}`;
      card.querySelector(".model").textContent = item.model;
      card.querySelector(".org").textContent = item.organization || t("noOrg");
      const badge = card.querySelector(".badge");
      badge.classList.add(item.availability === "open" ? "open" : "closed");
      badge.textContent = item.availability === "open" ? t("openBadge") : t("closedBadge");
      card.querySelector(".score strong").textContent = String(item.score);
      card.querySelector(".score span").textContent = state.lang === "zh" ? item.scoreLabel : item.scoreLabelEn;

      const tags = card.querySelector(".tags");
      tags.appendChild(makeTag(state.lang === "zh" ? item.sourceName : item.sourceNameEn));
      tags.appendChild(makeTag(item.license || t("noLicense")));
      if (item.note) tags.appendChild(makeTag(item.note));

      card.querySelector(".source").textContent = item.modelUrl ? new URL(item.modelUrl).hostname : "";
      const link = card.querySelector(".open-btn");
      link.textContent = t("openLink");
      link.href = item.modelUrl || item.sourceUrl || "#";
      return card;
    }

    function renderSection(sectionKey, titleKey, copyKey, items) {
      const node = elements.sectionTemplate.content.firstElementChild.cloneNode(true);
      node.querySelector("h2").textContent = t(titleKey);
      node.querySelector("p").textContent = t(copyKey);
      node.querySelector(".section-count").textContent = formatCount(items.length);

      const grid = node.querySelector(".grid");
      const empty = node.querySelector(".empty");
      if (!items.length) {
        grid.hidden = true;
        empty.hidden = false;
        empty.textContent = t("empty");
      } else {
        items.forEach((item) => grid.appendChild(renderCard(item)));
      }
      return node;
    }

    function renderSections(items) {
      const arenaItems = items.filter((item) => item.source === "lmarena");
      const openItems = items.filter((item) => item.source === "open-llm");
      elements.sections.innerHTML = "";
      elements.sections.appendChild(renderSection("lmarena", "sectionArenaTitle", "sectionArenaCopy", arenaItems));
      elements.sections.appendChild(renderSection("open-llm", "sectionOpenTitle", "sectionOpenCopy", openItems));
    }

    function render() {
      window.SiteI18n.applyMessages(copy, state.lang);
      renderChips();
      if (!state.payload) return;
      const filtered = filterItems(state.payload.items);
      renderStats(filtered);
      renderSections(filtered);
    }

    async function loadData() {
      const response = await fetch("/notes/model-ranking-data.json", { cache: "no-store" });
      if (!response.ok) throw new Error(`Failed to load ranking data: ${response.status}`);
      state.payload = await response.json();
      render();
    }

    elements.search.addEventListener("input", (event) => {
      state.search = event.target.value.trim().toLowerCase();
      render();
    });

    state.lang = window.SiteI18n.getLang();
    window.SiteI18n.bindPage(copy, (lang) => {
      state.lang = lang;
      render();
    });

    loadData().catch((error) => {
      elements.sections.innerHTML = `<div class="empty">${error.message}</div>`;
      elements.heroUpdated.textContent = error.message;
    });
  </script>
<script id="claw-grid-script">
(function(){
  const hideBlock = (selector) => {
    const el = document.querySelector(selector);
    if (!el) return;
    const section = el.closest('.section') || el.closest('.stats');
    if (section) section.style.display = 'none';
    else el.style.display = 'none';
  };
  ['#stats','#quick-grid','#featured-grid','.hero-actions'].forEach(hideBlock);

  const initials = (text) => {
    const clean = (text || '').replace(/\s+/g,' ').trim();
    if (!clean) return 'AI';
    if (/^[A-Za-z0-9]/.test(clean)) {
      const parts = clean.split(/[^A-Za-z0-9]+/).filter(Boolean);
      return (parts[0] || clean).slice(0,2).toUpperCase();
    }
    return clean.slice(0,2);
  };

  const enhanceCard = (card) => {
    if (card.querySelector('.mini-logo')) return;
    const top = card.querySelector('.tool-top') || card.querySelector('.card-top');
    if (!top) return;
    const info = top.querySelector('div');
    if (!info) return;
    const title = info.querySelector('h3,.model,h4');
    if (!title) return;
    const wrap = document.createElement('div');
    wrap.className = 'compact-head';
    const logo = document.createElement('span');
    logo.className = 'mini-logo';
    logo.textContent = initials(title.textContent);
    const copy = document.createElement('div');
    copy.className = 'compact-copy';
    while (info.firstChild) {
      copy.appendChild(info.firstChild);
    }
    wrap.appendChild(logo);
    wrap.appendChild(copy);
    info.appendChild(wrap);
  };

  document.querySelectorAll('.tool-card,.quick-card,.card').forEach(enhanceCard);
})();
</script></body>
</html>
