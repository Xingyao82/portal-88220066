name: Update model ranking data
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refresh data
        run: pwsh -NoLogo -NoProfile -File scripts/update-model-ranking.ps1
      - name: Commit changes
        run: |
          if git diff --quiet -- notes/model-ranking-data.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes/model-ranking-data.json
          git commit -m "chore: refresh model ranking data"
          git push
