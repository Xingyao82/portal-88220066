name: Check portal API
on:
  push:
    paths: ['workers/portal-api/**', '.github/workflows/check-portal-api.yml']
  pull_request:
    paths: ['workers/portal-api/**', '.github/workflows/check-portal-api.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/portal-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workers/portal-api/package-lock.json
      - run: npm ci
      - run: npm run check
