<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AsterLab Tools</title>
    <meta name="description" content="AsterLab Tools" />
    <meta
      name="keywords"
      content="前端工具站,编程工具,生活工具,图片工具,文本工具,JSON工具,Markdown工具"
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;800&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="ambient ambient-a"></div>
      <div class="ambient ambient-b"></div>
      <div class="ambient ambient-c"></div>

      <header class="hero">
        <div class="hero-copy reveal">
          <p class="hero-kicker">AsterLab Tools</p>

          <div class="hero-actions">
            <button class="primary-btn" data-jump="workspace">打开工作台</button>
            <button class="secondary-btn" data-jump="tool-gallery">浏览工具</button>
          </div>
        </div>
      </header>

      <section class="toolbar reveal" id="tool-gallery">
        <div class="toolbar-left">
          <label class="search-field" for="tool-search">
            <span>查找工具</span>
            <input
              id="tool-search"
              type="search"
              placeholder="例如：JSON、图片、排班、简历、PDF"
              autocomplete="off"
            />
          </label>
        </div>

        <div class="toolbar-right">
          <div id="category-chips" class="chip-row" aria-label="工具分类"></div>
        </div>
      </section>

      <main class="main-layout">
        <section class="gallery reveal">
          <div class="section-head">
            <div>
              <h2>工具</h2>
            </div>
          </div>

          <div id="tool-grid" class="tool-grid" aria-live="polite"></div>
        </section>

        <section class="workspace reveal" id="workspace">
          <div class="section-head">
            <div>
              <h2 id="workspace-title">工具工作台</h2>
            </div>
            <div class="workspace-actions">
              <button id="toggle-favorite-btn" class="ghost-btn" type="button">收藏当前工具</button>
              <button id="open-sample-btn" class="ghost-btn" type="button">载入示例</button>
              <button id="copy-deep-link-btn" class="ghost-btn" type="button">复制当前工具链接</button>
            </div>
          </div>

          <div class="workspace-shell">
            <aside class="workspace-side">
              <div class="workspace-meta-card">
                <p class="meta-label">当前工具</p>
                <h3 id="active-tool-name">开发数据工坊</h3>
                <p id="active-tool-summary" class="meta-summary"></p>
              </div>

              <div class="workspace-meta-card">
                <p class="meta-label">标签</p>
                <div id="active-tool-tags" class="tag-row"></div>
              </div>

              <div class="workspace-meta-card">
                <p class="meta-label">最近收藏</p>
                <div id="favorites-list" class="favorites-list"></div>
              </div>
            </aside>

            <div class="workspace-main">
              <div id="workspace-panel" class="workspace-panel"></div>
            </div>
          </div>
        </section>
      </main>

      <footer class="site-footer reveal">
        <div>
          <p class="footer-brand">AsterLab Tools</p>
        </div>
        <div class="footer-links">
          <a href="README.md">README</a>
          <a href="#tool-gallery">工具列表</a>
          <a href="#workspace">工作台</a>
        </div>
      </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
