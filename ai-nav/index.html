<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 工具导航 | 88220066.xyz</title>
  <meta name="description" content="把常用 AI 工具整理成一个更好找的导航页，按聊天、代码、设计、搜索、音视频和效率场景快速筛选。">
  <meta name="theme-color" content="#0c1020">
  <style>
    :root {
      --text: #edf2ff;
      --muted: #a9b3cf;
      --line: rgba(255,255,255,0.1);
      --accent: #7c68ff;
      --max: 1220px;
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "PingFang SC", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 15%, rgba(124, 104, 255, 0.24), transparent 0 26%),
        radial-gradient(circle at 85% 12%, rgba(37, 195, 165, 0.16), transparent 0 24%),
        radial-gradient(circle at 50% 86%, rgba(255, 157, 66, 0.14), transparent 0 22%),
        linear-gradient(180deg, #09101e 0%, #0d1326 48%, #0b1020 100%);
    }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    .shell { width: min(calc(100% - 28px), var(--max)); margin: 0 auto; padding: 24px 0 54px; }
    .nav, .toolbar, .section {
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(15, 22, 42, 0.88), rgba(11, 16, 31, 0.92));
      backdrop-filter: blur(16px);
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.26);
    }
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 22px;
      border-radius: 22px;
    }
    .brand { font-weight: 700; letter-spacing: -0.03em; }
    .nav-links { display: flex; gap: 18px; color: var(--muted); flex-wrap: wrap; }
    .nav-links a:hover, .nav-links a.active { color: var(--text); }
    .toolbar { margin-top: 18px; padding: 20px; border-radius: 24px; }
    .toolbar-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .toolbar-head h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: -0.05em;
    }
    .toolbar-head p {
      margin: 10px 0 0;
      max-width: 48rem;
      color: var(--muted);
      line-height: 1.75;
    }
    .count {
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(124, 104, 255, 0.12);
      color: #f4f6ff;
      font-size: 0.94rem;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }
    .stat {
      padding: 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.04);
    }
    .stat-label {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 8px;
    }
    .stat strong {
      display: block;
      font-size: 1rem;
      line-height: 1.5;
    }
    .search { margin-top: 18px; }
    .search input {
      width: 100%;
      min-height: 52px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      padding: 0 16px;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }
    .filter-stack {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }
    .filter-row {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    .filter-label {
      min-width: 84px;
      padding-top: 8px;
      color: var(--muted);
      font-size: 0.94rem;
    }
    .filter-row .chips {
      margin-top: 0;
      flex: 1;
    }
    .chip-btn {
      padding: 10px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      color: var(--muted);
      cursor: pointer;
      transition: 160ms ease;
    }
    .chip-btn.active, .chip-btn:hover {
      color: var(--text);
      border-color: rgba(124, 104, 255, 0.4);
      background: rgba(124, 104, 255, 0.14);
    }
    .section { margin-top: 18px; padding: 22px; border-radius: var(--radius-xl); }
    .section-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: end;
      margin-bottom: 18px;
    }
    .section-head h2 {
      margin: 0;
      font-size: 1.4rem;
      letter-spacing: -0.04em;
    }
    .section-head p {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.7;
    }
    .quick-grid, .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    .quick-card, .tool-card {
      position: relative;
      display: grid;
      gap: 14px;
      padding: 18px;
      border-radius: var(--radius-lg);
      border: 1px solid color-mix(in srgb, var(--tool-accent, rgba(255,255,255,0.16)) 58%, rgba(255,255,255,0.08));
      background: linear-gradient(180deg, color-mix(in srgb, var(--tool-accent, rgba(255,255,255,0.04)) 10%, rgba(255,255,255,0.04)), rgba(255,255,255,0.03));
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tool-accent, rgba(255,255,255,0.15)) 18%, transparent);
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
    }
    .quick-card { min-height: 170px; }
    .tool-card { min-height: 210px; }
    .quick-card::before, .tool-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 4px;
      border-radius: var(--radius-lg) 0 0 var(--radius-lg);
      background: var(--tool-accent, var(--accent));
    }
    .quick-card:hover, .tool-card:hover {
      transform: translateY(-4px);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tool-accent, var(--accent)) 28%, transparent), 0 18px 46px rgba(0,0,0,0.28);
    }
    .tool-top {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
    }
    .meta, .quick-card p, .tool-card p {
      margin: 0;
      line-height: 1.7;
      color: var(--muted);
    }
    .quick-card h3, .tool-card h3 {
      margin: 4px 0 0;
      font-size: 1.14rem;
    }
    .badge, .status-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      font-size: 12px;
      color: #f5f7ff;
      background: color-mix(in srgb, var(--tool-accent, var(--accent)) 74%, black 26%);
    }
    .status-badge {
      background: rgba(255,255,255,0.08);
    }
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip {
      display: inline-flex;
      padding: 7px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      font-size: 12px;
      color: var(--muted);
    }
    .mini-list {
      display: grid;
      gap: 8px;
    }
    .mini-list div {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .mini-list strong {
      color: var(--text);
      font-weight: 600;
      text-align: right;
    }
    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: auto;
      flex-wrap: wrap;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .visit {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 14px;
      border-radius: 999px;
      color: #08111f;
      background: color-mix(in srgb, var(--tool-accent, var(--accent)) 82%, white 18%);
    }
    .empty {
      padding: 20px;
      border-radius: var(--radius-lg);
      border: 1px dashed rgba(255,255,255,0.16);
      color: var(--muted);
      text-align: center;
    }
    @media (max-width: 1180px) {
      .stats, .quick-grid, .grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 720px) {
      .shell { width: min(calc(100% - 18px), var(--max)); }
      .nav { flex-direction: column; align-items: flex-start; }
      .filter-row { flex-direction: column; gap: 10px; }
      .filter-label { min-width: auto; padding-top: 0; }
      .stats, .quick-grid, .grid { grid-template-columns: 1fr; }
      .section-head { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="nav">
      <div class="brand">88220066.xyz / AI 工具导航</div>
      <nav class="nav-links" aria-label="Primary">
        <a href="/">首页</a>

    <section class="section">

    <section class="section">
      <div class="section-head">

        </div>
      </div>
      <div id="grid" class="grid"></div>
    </section>
  </div>

  <script src="./app.js"></script>
</body>
</html>
