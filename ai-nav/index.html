    const metaDescription = document.querySelector('meta[name="description"]');
    const searchEl = document.getElementById("search-input");
    const chipsEl = document.getElementById("chips");
    const gridEl = document.getElementById("grid");
    const countEl = document.getElementById("count");

    const state = {
      locale: localStorage.getItem(AI_STORAGE_KEY) || "zh",
      category: "",
      search: ""
    };

    function currentCopy() {
      return AI_I18N[state.locale] || AI_I18N.zh;
    }

    function categoriesForLocale() {
      const copy = currentCopy();
      return [copy.all, ...new Set(tools.map((tool) => copy[tool.categoryKey]))];
    }

    function applyLocale(locale) {
      state.locale = locale;
      const copy = currentCopy();
      document.documentElement.lang = copy.lang;
      document.title = copy.title;
      metaDescription.setAttribute("content", copy.description);
      searchEl.placeholder = copy.search_placeholder;
      if (!categoriesForLocale().includes(state.category)) {
        state.category = copy.all;
      }

      document.querySelectorAll("[data-i18n]").forEach((node) => {
        const key = node.getAttribute("data-i18n");
        node.textContent = copy[key] || "";
      });

      document.querySelectorAll("[data-lang]").forEach((button) => {
        button.classList.toggle("active", button.getAttribute("data-lang") === locale);
      });

      localStorage.setItem(AI_STORAGE_KEY, locale);
      renderChips();
      renderGrid();
    }

    function renderChips() {
      const categories = categoriesForLocale();
      chipsEl.innerHTML = categories.map((category) => `
        <button class="chip-btn ${category === state.category ? "active" : ""}" data-category="${category}" type="button">${category}</button>
      `).join("");
    }

    function renderGrid() {
      const copy = currentCopy();
      const items = tools.filter((tool) => {
        const localizedCategory = copy[tool.categoryKey];
        const localizedSummary = tool.summary[state.locale];
        const localizedTags = tool.tags[state.locale];
        const matchCategory = state.category === copy.all || localizedCategory === state.category;
        const haystack = [tool.name, localizedCategory, localizedSummary, ...localizedTags].join(" ").toLowerCase();
        const matchSearch = !state.search || haystack.includes(state.search);
        return matchCategory && matchSearch;
      });

      countEl.textContent = `${copy.showing} ${items.length} / ${tools.length} ${copy.tools}`;

      if (!items.length) {
        gridEl.innerHTML = `<div class="empty">${copy.noMatch}</div>`;
        return;
      }

      gridEl.innerHTML = items.map((tool) => `
        <article class="tool-card" style="--tool-accent:${tool.accent}">
          <div class="tool-top">
            <div>
              <div class="meta">${copy[tool.categoryKey]}</div>
              <h3>${tool.name}</h3>
            </div>
            <span class="badge">${copy[tool.priceKey]}</span>
          </div>
          <p>${tool.summary[state.locale]}</p>
          <div class="tag-row">
            ${tool.tags[state.locale].map((tag) => `<span class="chip">${tag}</span>`).join("")}
          </div>
          <div class="card-bottom">
            <span class="meta">${tool.url.replace(/^https?:\\/\\//, "").replace(/\\/$/, "")}</span>
            <a class="visit" href="${tool.url}" target="_blank" rel="noreferrer">${copy.open}</a>
          </div>
        </article>
      `).join("");
    }

    chipsEl.addEventListener("click", (event) => {
      const button = event.target.closest("[data-category]");
      if (!button) return;
      state.category = button.dataset.category;
      renderChips();
      renderGrid();
    });

    searchEl.addEventListener("input", () => {
      state.search = searchEl.value.trim().toLowerCase();
      renderGrid();
    });

    document.querySelectorAll("[data-lang]").forEach((button) => {
      button.addEventListener("click", () => applyLocale(button.getAttribute("data-lang")));
    });

    applyLocale(state.locale);
  </script>
