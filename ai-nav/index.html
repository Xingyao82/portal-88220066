      chipsEl.innerHTML = categories.map((category) => `
        <button class="chip-btn ${category === state.category ? "active" : ""}" data-category="${category}" type="button">${category}</button>
      `).join("");
    }

    function renderGrid() {
      const items = tools.filter((tool) => {
        const localizedCategory = labels[tool.categoryKey];
        const haystack = [tool.name, localizedCategory, tool.summary, ...tool.tags].join(" ").toLowerCase();
        const matchCategory = state.category === labels.all || localizedCategory === state.category;
        const matchSearch = !state.search || haystack.includes(state.search);
        return matchCategory && matchSearch;
      });

      countEl.textContent = `${labels.showing} ${items.length} / ${tools.length} ${labels.tools}`;

      if (!items.length) {
        gridEl.innerHTML = `<div class="empty">${labels.noMatch}</div>`;
        return;
      }

      gridEl.innerHTML = items.map((tool) => `

      if (!button) return;
      state.category = button.dataset.category;
      renderChips();

    });

    searchEl.addEventListener("input", () => {
      state.search = searchEl.value.trim().toLowerCase();
      renderGrid();
