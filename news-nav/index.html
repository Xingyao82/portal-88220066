<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新闻 | 88220066.xyz</title>
  <meta name="description" content="自动更新财经、科技、Income、AI、X、GitHub 和 Reddit 热门新闻。">
  <meta name="theme-color" content="#f8fafc">
  <script src="../notes/site-i18n.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --line: rgba(15, 23, 42, 0.08);
      --accent: #2563eb;
      --soft: rgba(37, 99, 235, 0.10);
      --gold: #b7791f;
      --max: 1240px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
    }

    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    .shell { width: min(calc(100% - 28px), var(--max)); margin: 0 auto; padding: 20px 0 44px; }
    .nav, .toolbar, .news-shell {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
    }
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 22px;
      border-radius: 8px;
    }
    .brand { font-weight: 700; }
    .nav-links { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); }
    .nav-links a:hover, .nav-links a.active { color: var(--accent); }
    .toolbar {
      margin-top: 16px;
      padding: 18px;
      border-radius: 8px;
    }
    .toolbar-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 2.1rem; letter-spacing: 0; }
    .status { color: var(--muted); font-size: 0.92rem; line-height: 1.6; text-align: right; }
    .controls { display: grid; gap: 12px; margin-top: 16px; }
    .search input {
      width: 100%;
      min-height: 48px;
      padding: 0 14px;
      border-radius: 8px;
      border: 1px solid var(--line);
      color: var(--text);
      background: #fff;
    }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      min-height: 38px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: #fff;
      cursor: pointer;
    }
    .chip.active, .chip:hover {
      color: var(--accent);
      border-color: rgba(37, 99, 235, 0.28);
      background: var(--soft);
    }
    .news-shell {
      margin-top: 16px;
      border-radius: 8px;
      overflow: hidden;
    }
    .news-grid { display: grid; grid-template-columns: 1.08fr 0.92fr; }
    .lead, .feed { padding: 18px; }
    .lead { border-right: 1px solid var(--line); }
    .section-title {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .lead-card {
      display: grid;
      gap: 12px;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid rgba(37, 99, 235, 0.18);
      background: linear-gradient(180deg, rgba(37, 99, 235, 0.08), rgba(255,255,255,0.92));
    }
    .lead-stack {
      display: grid;
      gap: 12px;
    }
    .lead-card h2 { margin: 0; font-size: 1.45rem; line-height: 1.25; }
    .lead-card p, .summary, .meta { margin: 0; color: var(--muted); line-height: 1.65; }
    .article-list { display: grid; }
    .article {
      display: grid;
      gap: 7px;
      padding: 13px 0;
      border-top: 1px solid var(--line);
    }
    .article:first-child { border-top: 0; padding-top: 0; }
    .article h3 { margin: 0; font-size: 1rem; line-height: 1.35; }
    .meta-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 0.82rem; }
    .pill {
      display: inline-flex;
      min-height: 24px;
      align-items: center;
      padding: 0 8px;
      border-radius: 999px;
      color: var(--gold);
      background: rgba(183, 121, 31, 0.1);
    }
    .empty, .error {
      padding: 24px;
      color: var(--muted);
      text-align: center;
    }
    @media (max-width: 860px) {
      .nav { flex-direction: column; align-items: flex-start; }
      .news-grid { grid-template-columns: 1fr; }
      .lead { border-right: 0; border-bottom: 1px solid var(--line); }
      .status { text-align: left; }
    }
  </style>
  <link rel="stylesheet" href="../notes/page-sync.css">
  <script defer src="../notes/project-nav.js"></script>
</head>
<body data-i18n-title="pageTitle" data-i18n-description="pageDescription">
  <div class="shell">
    <header class="nav">
      <div class="brand" id="brand">88220066.xyz / 新闻</div>
      <nav class="nav-links" aria-label="Primary">
        <a href="/ai-nav/">AI 导航</a>
        <a href="/finance-nav/">金融导航</a>
        <a href="/income-nav/">Income 导航</a>
        <a href="/options-income-compare/">期权 Income 对比台</a>
        <a href="/etf-compare/">ETF 对比</a>
        <a href="/news-nav/" class="active">新闻</a>
        <a href="/free-api-nav/">API 导航</a>
        <a href="/tools-nav/">工具导航</a>
        <a href="/english-tools/">英语导航</a>
        <a href="/skills-nav/">技能</a>
      </nav>
    </header>

    <section class="toolbar">
      <div class="toolbar-head">
        <h1 data-i18n="heroTitle">新闻</h1>
        <div class="status" id="status">加载中</div>
      </div>
      <div class="controls">
        <label class="search">
          <input id="search" type="search" placeholder="搜索标题、来源、分类">
        </label>
        <div class="chips" id="category-chips"></div>
      </div>
    </section>

    <main class="news-shell">
      <div class="news-grid">
        <section class="lead">
          <div class="section-title">
            <span data-i18n="leadTitle">最新重点</span>
            <span id="lead-count"></span>
          </div>
          <div id="lead"></div>
        </section>
        <section class="feed">
          <div class="section-title">
            <span data-i18n="feedTitle">新闻流</span>
            <span id="feed-count"></span>
          </div>
          <div class="article-list" id="feed"></div>
        </section>
      </div>
    </main>
  </div>

  <script>
    const pageCopy = {
      pageTitle: { zh: "新闻 | 88220066.xyz", en: "News | 88220066.xyz" },
      pageDescription: {
        zh: "自动更新财经、科技、Income、AI 和 GitHub 热门新闻。",
        en: "Auto-updated finance, tech, income, AI, and GitHub news."
      },
      heroTitle: { zh: "新闻", en: "News" },
      leadTitle: { zh: "最新重点", en: "Latest" },
      feedTitle: { zh: "新闻流", en: "Feed" }
    };

    const labels = {
      zh: {
        brand: "88220066.xyz / 新闻",
        search: "搜索标题、译文、来源、分类",
        all: "全部",
        updated: "更新",
        items: "条",
        empty: "当前没有匹配新闻。",
        loading: "加载中"
      },
      en: {
        brand: "88220066.xyz / News",
        search: "Search title, translation, source, category",
        all: "All",
        updated: "Updated",
        items: "items",
        empty: "No matching news.",
        loading: "Loading"
      }
    };

    const LEAD_COUNT = 4;
    const categoryOrder = ["all", "finance", "tech", "income", "ai", "github"];
    const fallbackCategories = {
      finance: { zh: "财经", en: "Finance" },
      tech: { zh: "科技", en: "Tech" },
      income: { zh: "Income", en: "Income" },
      ai: { zh: "AI", en: "AI" },
      github: { zh: "GitHub 热门", en: "GitHub Hot" }
    };
    const state = { category: "all", query: "", items: [], categories: fallbackCategories, updatedAt: "" };

    const statusEl = document.getElementById("status");
    const searchEl = document.getElementById("search");
    const chipEl = document.getElementById("category-chips");
    const leadEl = document.getElementById("lead");
    const feedEl = document.getElementById("feed");
    const leadCountEl = document.getElementById("lead-count");
    const feedCountEl = document.getElementById("feed-count");

    function categoryLabel(key, lang) {
      if (key === "all") return labels[lang].all;
      return (state.categories[key] || fallbackCategories[key] || { zh: key, en: key })[lang];
    }

    function formatTime(value, lang) {
      return new Intl.DateTimeFormat(lang === "zh" ? "zh-CN" : "en-US", {
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      }).format(new Date(value));
    }

    function escapeHtml(value = "") {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function filteredItems(lang) {
      const query = state.query.toLowerCase();
      return state.items.filter((item) => {
        const inCategory = state.category === "all" || item.category === state.category;
        const text = [item.title, item.titleZh, item.summary, item.summaryZh, item.source, categoryLabel(item.category, lang)].join(" ").toLowerCase();
        return inCategory && (!query || text.includes(query));
      });
    }

    function articleTemplate(item, lang, lead = false) {
      const titleTag = lead ? "h2" : "h3";
      const titleText = lang === "zh" && item.titleZh ? item.titleZh : item.title;
      const originalTitle = lang === "zh" && item.titleZh ? item.title : "";
      const summaryText = lang === "zh" && item.summaryZh ? item.summaryZh : item.summary;
      const title = escapeHtml(titleText);
      const source = escapeHtml(item.source);
      const itemUrl = escapeHtml(item.url);
      const summary = escapeHtml((summaryText || "").slice(0, lead ? 220 : 150));
      const original = escapeHtml(originalTitle);
      return `
        <article class="${lead ? "lead-card" : "article"}">
          <div class="meta-row">
            <span class="pill">${categoryLabel(item.category, lang)}</span>
            <span>${source}</span>
            <span>${formatTime(item.publishedAt, lang)}</span>
          </div>
          <${titleTag}><a href="${itemUrl}" target="_blank" rel="noreferrer">${title}</a></${titleTag}>
          ${original ? `<p class="meta">${original}</p>` : ""}
          ${summary ? `<p class="summary">${summary}</p>` : ""}
        </article>
      `;
    }

    function renderChips(lang) {
      chipEl.innerHTML = categoryOrder.map((key) => {
        const active = state.category === key ? " active" : "";
        return `<button class="chip${active}" type="button" data-category="${key}">${categoryLabel(key, lang)}</button>`;
      }).join("");
    }

    function renderPage(lang) {
      document.getElementById("brand").textContent = labels[lang].brand;
      searchEl.placeholder = labels[lang].search;
      renderChips(lang);
      const items = filteredItems(lang);
      const leadItems = items.slice(0, LEAD_COUNT);
      const rest = items.slice(LEAD_COUNT);
      leadCountEl.textContent = `${items.length} ${labels[lang].items}`;
      feedCountEl.textContent = "";
      leadEl.innerHTML = leadItems.length ? `<div class="lead-stack">${leadItems.map((item) => articleTemplate(item, lang, true)).join("")}</div>` : `<div class="empty">${labels[lang].empty}</div>`;
      feedEl.innerHTML = rest.length ? rest.map((item) => articleTemplate(item, lang)).join("") : `<div class="empty">${labels[lang].empty}</div>`;
      const updated = state.updatedAt ? formatTime(state.updatedAt, lang) : labels[lang].loading;
      statusEl.textContent = `${labels[lang].updated}: ${updated}`;
    }

    async function loadNews(lang) {
      statusEl.textContent = labels[lang].loading;
      try {
        const response = await fetch("/api/news?days=90");
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        state.items = payload.items || [];
        state.categories = payload.categories || fallbackCategories;
        state.updatedAt = payload.updatedAt || new Date().toISOString();
      } catch (error) {
        leadEl.innerHTML = `<div class="error">${labels[lang].empty}</div>`;
        feedEl.innerHTML = "";
      }
      renderPage(lang);
    }

    chipEl.addEventListener("click", (event) => {
      const button = event.target.closest("[data-category]");
      if (!button) return;
      state.category = button.dataset.category;
      renderPage(window.SiteI18n.getLang());
    });

    searchEl.addEventListener("input", () => {
      state.query = searchEl.value.trim();
      renderPage(window.SiteI18n.getLang());
    });

    window.SiteI18n.bindPage(pageCopy, (lang) => {
      renderPage(lang);
      if (!state.items.length) loadNews(lang);
    });
  </script>
</body>
</html>
