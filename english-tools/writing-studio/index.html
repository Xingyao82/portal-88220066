  <script>
    const demoText = "hi teacher, i want to explain my plan. i make a small english tool website, and i hope it can help students practice every day.";
    const state = { tone: "clear" };
    const inputEl = document.getElementById("input-text");
    const listEl = document.getElementById("rewrite-list");
    const statOriginal = document.getElementById("stat-original");
    const statVariants = document.getElementById("stat-variants");
    const statTone = document.getElementById("stat-tone");

    function cleanText(text) {
      return text.replace(/\s+/g, " ").replace(/\s+([,.!?;:])/g, "$1").trim();
    }

    function sentenceCase(text) {
      return text.replace(/(^|[.!?]\s+)([a-z])/g, (_, prefix, letter) => `${prefix}${letter.toUpperCase()}`);
    }

    function buildVariants(text) {
      const cleaned = sentenceCase(cleanText(text));
      const clear = cleaned;
      const formal = cleaned
        .replace(/\bI want to\b/gi, "I would like to")
        .replace(/\bI hope\b/gi, "I hope")
        .replace(/\bmake\b/gi, "am building")
        .replace(/\bhelp\b/gi, "support");
      const friendly = cleaned
        .replace(/\bI would like to\b/gi, "I want to")
        .replace(/\bstudents\b/gi, "learners")
        .replace(/\bevery day\b/gi, "day by day");
      return [
        { title: "\u6e05\u6d17\u7248", label: "\u5148\u628a\u7a7a\u683c\u3001\u5927\u5c0f\u5199\u548c\u6807\u70b9\u6574\u7406\u597d", text: clear },
        { title: "\u6e05\u6670\u8868\u8fbe", label: "\u9002\u5408\u4fdd\u7559\u539f\u610f\uff0c\u7a0d\u5fae\u66f4\u987a", text: clear },
        { title: "\u6b63\u5f0f\u4e00\u70b9", label: "\u9002\u5408\u8bf4\u660e\u3001\u90ae\u4ef6\u548c\u7b80\u5386\u5f0f\u8868\u8fbe", text: formal },
        { title: "\u53cb\u597d\u4e00\u70b9", label: "\u9002\u5408\u53e3\u543b\u66f4\u8f7b\u677e\u7684\u4ecb\u7ecd", text: friendly }
      ];
    }

    function render() {
      const text = inputEl.value.trim();
      const words = text ? cleanText(text).split(/\s+/).filter(Boolean).length : 0;
      statOriginal.textContent = String(words);
      statTone.textContent = ({ clear: "\u6e05\u6670", formal: "\u6b63\u5f0f", friendly: "\u53cb\u597d" })[state.tone];
      if (!text) {
        statVariants.textContent = "0";
        listEl.innerHTML = '<div class="empty">\u8f93\u5165\u82f1\u6587\u540e\uff0c\u8fd9\u91cc\u4f1a\u751f\u6210\u6e05\u6d17\u540e\u7684\u6587\u672c\u548c\u51e0\u79cd\u6539\u5199\u65b9\u5411\u3002</div>';
        return;
      }
      const variants = buildVariants(text);
      statVariants.textContent = String(variants.length);
      listEl.innerHTML = variants.map((item, index) => `
        <article class="rewrite-card">
          <div class="label">${item.title}</div>
          <div class="rewrite-text">${item.text}</div>
          <p style="margin:10px 0 0;">${item.label}</p>
          <div class="actions" style="margin-top:12px;">
            <button class="btn ${index === 1 ? "btn-primary" : ""}" type="button" data-copy="${item.text.replace(/"/g, "&quot;")}">\u590d\u5236\u8fd9\u4e00\u7248</button>
          </div>
        </article>
      `).join("");
    }

    document.getElementById("rewrite-btn").addEventListener("click", render);
    document.getElementById("demo-btn").addEventListener("click", () => {
      inputEl.value = demoText;
      render();
    });
    document.getElementById("copy-btn").addEventListener("click", () => {
      const variants = buildVariants(inputEl.value.trim());
      navigator.clipboard.writeText((variants[1] || variants[0] || {}).text || "");
    });

    listEl.addEventListener("click", (event) => {
      const button = event.target.closest("[data-copy]");
      if (!button) return;
      navigator.clipboard.writeText(button.dataset.copy);
    });

    document.querySelectorAll("[data-tone]").forEach((button) => {
      button.addEventListener("click", () => {
        state.tone = button.dataset.tone;
        document.querySelectorAll("[data-tone]").forEach((item) => item.classList.toggle("active", item === button));
        statTone.textContent = ({ clear: "\u6e05\u6670", formal: "\u6b63\u5f0f", friendly: "\u53cb\u597d" })[state.tone];
      });
    });
  </script>
