  <script>
    const demoText = `Learning a language takes patience. If you repeat a short sentence several times, your mouth becomes more comfortable with the rhythm. Over time, that small improvement turns into confidence.`;
    const inputEl = document.getElementById("input-text");
    const rateEl = document.getElementById("rate-select");
    const lineListEl = document.getElementById("line-list");
    const statLines = document.getElementById("stat-lines");
    const statRate = document.getElementById("stat-rate");
    const statCurrent = document.getElementById("stat-current");
    let currentIndex = -1;
    let lines = [];

    function splitLines(text) {
      return text.replace(/\s+/g, " ").trim().split(/(?<=[.!?])\s+/).filter(Boolean);
    }

    function renderLines() {
      statLines.textContent = String(lines.length);
      statRate.textContent = `${Number(rateEl.value).toFixed(1)}x`;
      if (!lines.length) {
        lineListEl.innerHTML = '<div class="empty">\u8f93\u5165\u4e00\u6bb5\u6587\u672c\u540e\uff0c\u8fd9\u91cc\u4f1a\u751f\u6210\u9010\u53e5\u8ddf\u8bfb\u5361\u7247\u3002</div>';
        statCurrent.textContent = "\u672a\u5f00\u59cb";
        return;
      }
      lineListEl.innerHTML = lines.map((line, index) => `
        <article class="line-card ${index === currentIndex ? "active" : ""}">
          <div class="line-head">
            <span class="line-index">\u7b2c ${index + 1} \u53e5</span>
            <div class="actions" style="margin-top:0;">
              <button class="btn btn-primary" type="button" data-speak="${index}">\u6717\u8bfb</button>
              <button class="btn" type="button" data-copy="${index}">\u590d\u5236</button>
            </div>
          </div>
          <div class="line-text">${line}</div>
          <div class="line-note">\u5efa\u8bae\uff1a\u5148\u542c\u4e00\u904d\uff0c\u518d\u81ea\u5df1\u8ddf\u8bfb\u4e24\u904d\uff0c\u6700\u540e\u8fde\u8bfb\u6574\u6bb5\u3002</div>
        </article>
      `).join("");
    }

    function speakLine(index) {
      const text = lines[index];
      if (!text) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "en-US";
      utterance.rate = Number(rateEl.value);
      utterance.onstart = () => {
        currentIndex = index;
        statCurrent.textContent = `\u7b2c ${index + 1} \u53e5`;
        renderLines();
      };
      utterance.onend = () => {
        currentIndex = index;
        renderLines();
      };
      window.speechSynthesis.speak(utterance);
    }

    document.getElementById("build-btn").addEventListener("click", () => {
      lines = splitLines(inputEl.value);
      currentIndex = -1;
      renderLines();
    });

    document.getElementById("demo-btn").addEventListener("click", () => {
      inputEl.value = demoText;
      lines = splitLines(demoText);
      currentIndex = -1;
      renderLines();
    });

    document.getElementById("stop-btn").addEventListener("click", () => {
      window.speechSynthesis.cancel();
      currentIndex = -1;
      statCurrent.textContent = "\u5df2\u505c\u6b62";
      renderLines();
    });

    rateEl.addEventListener("change", () => {
      statRate.textContent = `${Number(rateEl.value).toFixed(1)}x`;
    });

    lineListEl.addEventListener("click", (event) => {
      const speakBtn = event.target.closest("[data-speak]");
      if (speakBtn) {
        speakLine(Number(speakBtn.dataset.speak));
        return;
      }
      const copyBtn = event.target.closest("[data-copy]");
      if (copyBtn) {
        navigator.clipboard.writeText(lines[Number(copyBtn.dataset.copy)] || "");
      }
    });
  </script>
