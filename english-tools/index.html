    ];
    const statuses = [labels.allStatus,"\u514d\u8d39\u53ef\u7528"];
    const scenes = [labels.allScene,"\u67e5\u8bcd\u4e0e\u8bcd\u5178","\u542c\u529b\u4e0e\u7efc\u5408","\u8bed\u6cd5\u4e0e\u7efc\u5408","\u53d1\u97f3\u4e0e\u8ddf\u8bfb","\u9605\u8bfb\u7406\u89e3"];
    const state = { status:labels.allStatus, scene:labels.allScene, search:"" };
    const statusChipsEl = document.getElementById("status-chips"), sceneChipsEl = document.getElementById("scene-chips"), quickSceneGridEl = document.getElementById("quick-scene-grid"), quickGridEl = document.getElementById("quick-grid"), gridEl = document.getElementById("grid"), countEl = document.getElementById("count"), searchEl = document.getElementById("search-input");
    const renderChipGroup = (container, values, key, current) => container.innerHTML = values.map((value) => `<button class="chip-btn ${value === current ? "active" : ""}" data-${key}="${value}" type="button">${value}</button>`).join("");
    function renderChips() { renderChipGroup(statusChipsEl, statuses, "status", state.status); renderChipGroup(sceneChipsEl, scenes, "scene", state.scene); }
    function filteredTools() { return tools.filter((tool) => { const haystack = [tool.name, tool.status, tool.scene, tool.summary, tool.note, ...(tool.tags || [])].join(" ").toLowerCase(); return (state.status === labels.allStatus || tool.status === state.status) && (state.scene === labels.allScene || tool.scene === state.scene) && (!state.search || haystack.includes(state.search)); }); }
    function cardTemplate(tool) {
      return `<article class="tool-card" style="--tool-accent:${tool.accent}"><div class="tool-top"><div><div class="meta">${tool.scene}</div><h3>${tool.name}</h3></div><div class="btn-row"><span class="status-badge">${tool.status}</span><span class="badge">${tool.badge}</span></div></div><p>${tool.summary}</p><div class="tag-row">${(tool.tags || []).slice(0,5).map((tag) => `<span class="chip">${tag}</span>`).join("")}</div><div class="mini-list"><div><span>\u5f53\u524d\u72b6\u6001</span><strong>${tool.status}</strong></div><div><span>\u4f7f\u7528\u8bf4\u660e</span><strong>${tool.note}</strong></div></div><div class="card-bottom"><span class="meta">${tool.url}</span><div class="btn-row"><a class="visit" href="${tool.url}" target="_blank" rel="noreferrer noopener">${labels.open}</a></div></div></article>`;
    }
    function renderQuickSceneGrid() {
      const quickScenes = [
        { name:"\u67e5\u8bcd", scene:"\u67e5\u8bcd\u4e0e\u8bcd\u5178", accent:"#2563eb", summary:"\u8bcd\u5178\u3001\u4f8b\u53e5\u3001\u642d\u914d\u3001\u97f3\u6807" },
        { name:"\u542c\u529b", scene:"\u542c\u529b\u4e0e\u7efc\u5408", accent:"#0ea5e9", summary:"\u6162\u901f\u82f1\u8bed\u3001\u5206\u7ea7\u542c\u529b\u3001\u7ec3\u4e60\u9898" },
        { name:"\u53d1\u97f3", scene:"\u53d1\u97f3\u4e0e\u8ddf\u8bfb", accent:"#8b5cf6", summary:"\u771f\u5b9e\u53d1\u97f3\u3001\u89c6\u9891\u8bed\u5883\u3001\u8ddf\u8bfb" },
        { name:"\u8bed\u6cd5", scene:"\u8bed\u6cd5\u4e0e\u7efc\u5408", accent:"#22c55e", summary:"\u7cfb\u7edf\u7ec3\u4e60\u3001\u8bcd\u6c47\u3001\u6d4b\u8bd5\u8d44\u6e90" },
        { name:"\u9605\u8bfb", scene:"\u9605\u8bfb\u7406\u89e3", accent:"#ec4899", summary:"\u5206\u7ea7\u65b0\u95fb\u3001\u7cbe\u8bfb\u3001\u7406\u89e3\u8bad\u7ec3" },
        { name:"\u5199\u4f5c", scene:"\u8bed\u6cd5\u4e0e\u7efc\u5408", accent:"#ff6b8b", summary:"\u8bed\u6cd5\u8d44\u6e90\u3001\u5199\u4f5c\u6307\u5f15\u548c\u6b63\u5f0f\u8868\u8fbe" }
      ];
      quickSceneGridEl.innerHTML = quickScenes.map((item) => `
        <article class="tool-card" style="--tool-accent:${item.accent}">
          <div class="tool-top"><div><div class="meta">\u5feb\u6377\u5206\u7c7b</div><h3>${item.name}</h3></div><div class="btn-row"><span class="badge">\u5feb\u901f\u7b5b\u9009</span></div></div>
          <p>${item.summary}</p>
          <div class="card-bottom"><span class="meta">${item.scene}</span><div class="btn-row"><button class="visit" type="button" data-scene-jump="${item.scene}">\u67e5\u770b</button></div></div>
        </article>
      `).join("");
    }
    function renderQuickGrid() { quickGridEl.innerHTML = tools.filter((tool) => tool.score >= 5).slice(0,4).map(cardTemplate).join(""); }
    function renderGrid() { const items = filteredTools(); countEl.textContent = `${labels.showing} ${items.length} / ${tools.length} ${labels.items}`; renderQuickSceneGrid(); renderQuickGrid(); gridEl.innerHTML = items.length ? items.map(cardTemplate).join("") : `<div class="empty">${labels.noMatch}</div>`; }
    statusChipsEl.addEventListener("click", (event) => { const button = event.target.closest("[data-status]"); if (!button) return; state.status = button.dataset.status; renderChips(); renderGrid(); });
    sceneChipsEl.addEventListener("click", (event) => { const button = event.target.closest("[data-scene]"); if (!button) return; state.scene = button.dataset.scene; renderChips(); renderGrid(); });
    quickSceneGridEl.addEventListener("click", (event) => { const button = event.target.closest("[data-scene-jump]"); if (!button) return; state.scene = button.dataset.sceneJump; renderChips(); renderGrid(); });
    searchEl.addEventListener("input", () => { state.search = searchEl.value.trim().toLowerCase(); renderGrid(); });
    renderChips(); renderGrid();
  </script>
