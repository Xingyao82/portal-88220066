    const kinds = [labels.allKind,"\u81ea\u7814\u5de5\u5177","\u514d\u8d39\u7f51\u7ad9"];
    const statuses = [labels.allStatus,"\u5df2\u4e0a\u7ebf","\u514d\u8d39\u53ef\u7528"];
    const scenes = [labels.allScene,"\u542c\u5199\u7ec3\u4e60","\u8bcd\u6c47\u8bb0\u5fc6","\u9605\u8bfb\u7406\u89e3","\u53e3\u8bed\u8ddf\u8bfb","\u82f1\u6587\u5199\u4f5c","\u67e5\u8bcd\u4e0e\u8bcd\u5178","\u542c\u529b\u4e0e\u7efc\u5408","\u8bed\u6cd5\u4e0e\u7efc\u5408","\u53d1\u97f3\u4e0e\u8ddf\u8bfb"];
    const state = { kind:labels.allKind, status:labels.allStatus, scene:labels.allScene, search:"" };
    const kindChipsEl = document.getElementById("kind-chips"), statusChipsEl = document.getElementById("status-chips"), sceneChipsEl = document.getElementById("scene-chips"), quickGridEl = document.getElementById("quick-grid"), gridEl = document.getElementById("grid"), countEl = document.getElementById("count"), searchEl = document.getElementById("search-input");
    const renderChipGroup = (container, values, key, current) => container.innerHTML = values.map((value) => `<button class="chip-btn ${value === current ? "active" : ""}" data-${key}="${value}" type="button">${value}</button>`).join("");
    function renderChips() { renderChipGroup(kindChipsEl, kinds, "kind", state.kind); renderChipGroup(statusChipsEl, statuses, "status", state.status); renderChipGroup(sceneChipsEl, scenes, "scene", state.scene); }
    function filteredTools() { return tools.filter((tool) => { const haystack = [tool.name, tool.kind, tool.status, tool.scene, tool.summary, tool.note, ...(tool.tags || [])].join(" ").toLowerCase(); return (state.kind === labels.allKind || tool.kind === state.kind) && (state.status === labels.allStatus || tool.status === state.status) && (state.scene === labels.allScene || tool.scene === state.scene) && (!state.search || haystack.includes(state.search)); }); }
    function cardTemplate(tool) {
      const actions = tool.url ? `<div class="btn-row"><a class="visit" href="${tool.url}" ${tool.url.startsWith("http") ? 'target="_blank" rel="noreferrer noopener"' : ""}>${labels.open}</a></div>` : `<span class="disabled">${labels.pending}</span>`;
      return `<article class="tool-card" style="--tool-accent:${tool.accent}"><div class="tool-top"><div><div class="meta">${tool.kind} / ${tool.scene}</div><h3>${tool.name}</h3></div><div class="btn-row"><span class="status-badge">${tool.status}</span><span class="badge">${tool.badge}</span></div></div><p>${tool.summary}</p><div class="tag-row">${(tool.tags || []).slice(0,5).map((tag) => `<span class="chip">${tag}</span>`).join("")}</div><div class="mini-list"><div><span>\u5f53\u524d\u72b6\u6001</span><strong>${tool.status}</strong></div><div><span>\u4f7f\u7528\u8bf4\u660e</span><strong>${tool.note}</strong></div></div><div class="card-bottom"><span class="meta">${tool.url || "\u5373\u5c06\u52a0\u5165"}</span>${actions}</div></article>`;
    }
    function renderQuickGrid() { quickGridEl.innerHTML = tools.filter((tool) => tool.score >= 5).slice(0,4).map(cardTemplate).join(""); }
    function renderGrid() { const items = filteredTools(); countEl.textContent = `${labels.showing} ${items.length} / ${tools.length} ${labels.items}`; renderQuickGrid(); gridEl.innerHTML = items.length ? items.map(cardTemplate).join("") : `<div class="empty">${labels.noMatch}</div>`; }
    kindChipsEl.addEventListener("click", (event) => { const button = event.target.closest("[data-kind]"); if (!button) return; state.kind = button.dataset.kind; renderChips(); renderGrid(); });
    statusChipsEl.addEventListener("click", (event) => { const button = event.target.closest("[data-status]"); if (!button) return; state.status = button.dataset.status; renderChips(); renderGrid(); });
    sceneChipsEl.addEventListener("click", (event) => { const button = event.target.closest("[data-scene]"); if (!button) return; state.scene = button.dataset.scene; renderChips(); renderGrid(); });
    searchEl.addEventListener("input", () => { state.search = searchEl.value.trim().toLowerCase(); renderGrid(); });
    renderChips(); renderGrid();
