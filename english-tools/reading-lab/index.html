  <script>
    const demoText = `Although the experiment looked simple, the team spent weeks refining each step so that every result could be repeated accurately. When the final report arrived, the students realized that careful notes were just as important as creative ideas.`;
    const connectors = ["although", "because", "when", "while", "if", "but", "and", "or", "so", "that", "which", "who", "where", "however", "therefore"];
    const state = { mode: "normal" };
    const outputEl = document.getElementById("output");
    const inputEl = document.getElementById("input-text");
    const sentenceStat = document.getElementById("stat-sentences");
    const chunkStat = document.getElementById("stat-chunks");
    const modeStat = document.getElementById("stat-mode");

    function splitSentences(text) {
      return text.replace(/\s+/g, " ").trim().split(/(?<=[.!?])\s+/).filter(Boolean);
    }

    function splitChunks(sentence) {
      const normalized = sentence.replace(/([,;:])/g, " $1 ");
      const parts = normalized.split(/\s+/).reduce((acc, word) => {
        const lower = word.toLowerCase();
        if ([",", ";", ":"].includes(word)) {
          acc.push("|");
          return acc;
        }
        if (state.mode !== "normal" && connectors.includes(lower)) {
          acc.push("|", word);
          return acc;
        }
        acc.push(word);
        return acc;
      }, []);
      const joined = parts.join(" ").replace(/\s+\|\s+/g, "|");
      let chunks = joined.split("|").map((item) => item.trim()).filter(Boolean);
      if (state.mode === "soft") {
        chunks = chunks.flatMap((chunk) => chunk.split(/\s+(?=to|for|with|from|into|over)\s+/i).map((part) => part.trim()).filter(Boolean));
      }
      return chunks;
    }

    function analyze() {
      const text = inputEl.value.trim();
      if (!text) {
        outputEl.innerHTML = '<div class="empty">\u8f93\u5165\u4e00\u6bb5\u82f1\u6587\u540e\uff0c\u8fd9\u91cc\u4f1a\u6309\u53e5\u548c\u77ed\u8bed\u81ea\u52a8\u62c6\u5f00\u3002</div>';
        sentenceStat.textContent = "0";
        chunkStat.textContent = "0";
        return;
      }
      const sentences = splitSentences(text);
      let totalChunks = 0;
      outputEl.innerHTML = sentences.map((sentence, index) => {
        const chunks = splitChunks(sentence);
        totalChunks += chunks.length;
        return `
          <article class="chunk">
            <div class="chunk-head">
              <span class="chunk-index">\u53e5\u5b50 ${index + 1}</span>
              <span style="color:var(--muted);font-size:.9rem;">${chunks.length} \u4e2a\u77ed\u8bed\u5757</span>
            </div>
            <div class="sentence">${sentence}</div>
            <div class="phrase-line">${chunks.map((chunk) => `<span class="phrase">${chunk}</span>`).join("")}</div>
          </article>
        `;
      }).join("");
      sentenceStat.textContent = String(sentences.length);
      chunkStat.textContent = String(totalChunks);
    }

    document.getElementById("analyze-btn").addEventListener("click", analyze);
    document.getElementById("demo-btn").addEventListener("click", () => {
      inputEl.value = demoText;
      analyze();
    });
    document.getElementById("copy-btn").addEventListener("click", () => {
      const text = Array.from(outputEl.querySelectorAll(".chunk")).map((chunk) => chunk.innerText).join("\n\n");
      navigator.clipboard.writeText(text);
    });

    document.querySelectorAll("[data-mode]").forEach((button) => {
      button.addEventListener("click", () => {
        state.mode = button.dataset.mode;
        document.querySelectorAll("[data-mode]").forEach((item) => item.classList.toggle("active", item === button));
        modeStat.textContent = ({ normal: "\u6807\u51c6\u62c6\u53e5", soft: "\u66f4\u7ec6\u4e00\u70b9", focus: "\u7a81\u51fa\u8fde\u63a5\u8bcd" })[state.mode];
        analyze();
      });
    });
  </script>
