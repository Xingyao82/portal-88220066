  <script>
    const STORAGE_KEY = "english-vocab-cards-v1";
    const demoCards = [
      { word: "ability", phonetic: "/\u0259\u02c8b\u026al\u0259ti/", meaning: "\u80fd\u529b\uff0c\u672c\u9886", example: "Practice builds language ability.", level: "review" },
      { word: "focus", phonetic: "/\u02c8fo\u028ak\u0259s/", meaning: "\u4e13\u6ce8\uff0c\u805a\u7126", example: "Short sessions help you focus on difficult words.", level: "new" },
      { word: "review", phonetic: "/r\u026a\u02c8vju\u02d0/", meaning: "\u590d\u4e60\uff0c\u56de\u987e", example: "A quick review keeps the memory fresh.", level: "mastered" }
    ];

    const state = { cards: [], search: "", level: "all" };
    const els = {
      bulk: document.getElementById("bulk-input"),
      cards: document.getElementById("cards"),
      count: document.getElementById("stat-count"),
      review: document.getElementById("stat-review"),
      mastered: document.getElementById("stat-mastered"),
      search: document.getElementById("search-input"),
      level: document.getElementById("level-filter"),
      quickWord: document.getElementById("quick-word"),
      quickMeaning: document.getElementById("quick-meaning"),
      quickPhonetic: document.getElementById("quick-phonetic")
    };

    function loadCards() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        state.cards = raw ? JSON.parse(raw) : [];
      } catch {
        state.cards = [];
      }
    }

    function saveCards() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.cards));
    }

    function normalizeLevel(level) {
      return ["new", "review", "mastered"].includes(level) ? level : "new";
    }

    function parseLines(text) {
      return text.split(/\r?\n/).map((line) => line.trim()).filter(Boolean).map((line) => {
        const parts = line.split("|").map((item) => item.trim());
        return {
          word: parts[0] || "",
          phonetic: parts.length >= 4 ? parts[1] : "",
          meaning: parts.length >= 4 ? parts[2] : (parts[1] || ""),
          example: parts.length >= 4 ? parts[3] : (parts[2] || ""),
          level: "new"
        };
      }).filter((item) => item.word && item.meaning);
    }

    function upsertCards(newCards) {
      const map = new Map(state.cards.map((card) => [card.word.toLowerCase(), card]));
      newCards.forEach((card) => {
        map.set(card.word.toLowerCase(), { ...card, level: normalizeLevel(card.level) });
      });
      state.cards = Array.from(map.values()).sort((a, b) => a.word.localeCompare(b.word));
      saveCards();
      render();
    }

    function filteredCards() {
      return state.cards.filter((card) => {
        const text = [card.word, card.phonetic, card.meaning, card.example].join(" ").toLowerCase();
        const matchesSearch = !state.search || text.includes(state.search);
        const matchesLevel = state.level === "all" || card.level === state.level;
        return matchesSearch && matchesLevel;
      });
    }

    function levelLabel(level) {
      return ({ new: "\u65b0\u8bcd", review: "\u590d\u4e60\u4e2d", mastered: "\u5df2\u638c\u63e1" })[level] || "\u65b0\u8bcd";
    }

    function renderStats() {
      els.count.textContent = String(state.cards.length);
      els.review.textContent = String(state.cards.filter((card) => card.level !== "mastered").length);
      els.mastered.textContent = String(state.cards.filter((card) => card.level === "mastered").length);
    }

    function renderCards() {
      const cards = filteredCards();
      if (!cards.length) {
        els.cards.innerHTML = '<div class="empty">\u8fd8\u6ca1\u6709\u5339\u914d\u7684\u8bcd\u6c47\u5361\u7247\u3002\u53ef\u4ee5\u5148\u5bfc\u5165\u793a\u4f8b\uff0c\u6216\u8005\u624b\u52a8\u6dfb\u52a0\u51e0\u4e2a\u8bcd\u3002</div>';
        return;
      }
      els.cards.innerHTML = cards.map((card, index) => `
        <article class="card">
          <div class="card-top">
            <div>
              <div class="level">${levelLabel(card.level)}</div>
              <div class="word">${card.word}</div>
              ${card.phonetic ? `<div class="phonetic">${card.phonetic}</div>` : ""}
            </div>
            <select data-index="${index}" class="level-select">
              <option value="new" ${card.level === "new" ? "selected" : ""}>\u65b0\u8bcd</option>
              <option value="review" ${card.level === "review" ? "selected" : ""}>\u590d\u4e60\u4e2d</option>
              <option value="mastered" ${card.level === "mastered" ? "selected" : ""}>\u5df2\u638c\u63e1</option>
            </select>
          </div>
          <p class="meaning">${card.meaning}</p>
          ${card.example ? `<div class="examples"><strong>\u4f8b\u53e5\uff1a</strong>${card.example}</div>` : ""}
          <div class="actions" style="margin-top:14px;">
            <button class="btn btn-secondary" type="button" data-delete="${card.word}">\u5220\u9664</button>
          </div>
        </article>
      `).join("");
    }

    function render() {
      renderStats();
      renderCards();
    }

    document.getElementById("import-btn").addEventListener("click", () => {
      const cards = parseLines(els.bulk.value);
      if (!cards.length) return;
      upsertCards(cards);
      els.bulk.value = "";
    });

    document.getElementById("quick-add").addEventListener("click", () => {
      const word = els.quickWord.value.trim();
      const meaning = els.quickMeaning.value.trim();
      if (!word || !meaning) return;
      upsertCards([{ word, meaning, phonetic: els.quickPhonetic.value.trim(), example: "", level: "new" }]);
      els.quickWord.value = "";
      els.quickMeaning.value = "";
      els.quickPhonetic.value = "";
    });

    document.getElementById("load-demo").addEventListener("click", () => {
      upsertCards(demoCards);
    });

    document.getElementById("clear-all").addEventListener("click", () => {
      state.cards = [];
      saveCards();
      render();
    });

    document.getElementById("export-btn").addEventListener("click", () => {
      const text = state.cards.map((card) => [card.word, card.phonetic, card.meaning, card.example].filter(Boolean).join(" | ")).join("\n");
      navigator.clipboard.writeText(text);
    });

    els.search.addEventListener("input", () => {
      state.search = els.search.value.trim().toLowerCase();
      render();
    });

    els.level.addEventListener("change", () => {
      state.level = els.level.value;
      render();
    });

    els.cards.addEventListener("change", (event) => {
      const select = event.target.closest(".level-select");
      if (!select) return;
      const visibleCards = filteredCards();
      const current = visibleCards[Number(select.dataset.index)];
      const target = state.cards.find((card) => card.word === current.word);
      if (!target) return;
      target.level = select.value;
      saveCards();
      render();
    });

    els.cards.addEventListener("click", (event) => {
      const button = event.target.closest("[data-delete]");
      if (!button) return;
      state.cards = state.cards.filter((card) => card.word !== button.dataset.delete);
      saveCards();
      render();
    });

    loadCards();
    render();
  </script>
